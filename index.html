<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七日の灯</title>
<meta name="description" content="1分の行動を7日ともし切って、習慣として浄化していく。">
<meta name="theme-color" content="#0B111C">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="七日の灯">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ── 宵（既定）──────────────────────────────── */
:root{
  --ink:#0B111C;
  --surface:#141C2B;
  --surface-2:#1A2436;
  --line:#26314A;
  --line-soft:#1E293D;
  --text:#ECE7DD;
  --dim:#8B95AB;
  --faint:#5B6579;
  --flame:#F0B152;
  --flame-ink:#0B111C;
  --flame-glow:rgba(240,177,82,.42);
  --flame-wash:rgba(240,177,82,.13);
  --water:#86BACB;
  --water-wash:rgba(134,186,203,.12);
  --rest:#2B3651;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px -18px rgba(0,0,0,.9);

  --display:"Zen Kaku Gothic New",'Hiragino Sans',system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",'Hiragino Sans',system-ui,sans-serif;
  --mono:"Zen Kaku Gothic New",'Hiragino Sans',system-ui,sans-serif;
}
/* ── 白磁（OSがライトのとき／明示ライト）──────── */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#EBEEF1;
    --surface:#FFFFFF;
    --surface-2:#F4F6F8;
    --line:#D5DBE3;
    --line-soft:#E3E7EC;
    --text:#141B27;
    --dim:#5F6B7E;
    --faint:#8B95A5;
    --flame:#AE6408;
    --flame-ink:#FFFFFF;
    --flame-glow:rgba(174,100,8,.28);
    --flame-wash:rgba(174,100,8,.10);
    --water:#2C6C81;
    --water-wash:rgba(44,108,129,.10);
    --rest:#CFD6DF;
    --shadow:0 1px 2px rgba(20,27,39,.05), 0 12px 28px -20px rgba(20,27,39,.35);
  }
}
:root[data-theme="light"]{
  --ink:#EBEEF1; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --line:#D5DBE3; --line-soft:#E3E7EC; --text:#141B27; --dim:#5F6B7E; --faint:#8B95A5;
  --flame:#AE6408; --flame-ink:#FFFFFF; --flame-glow:rgba(174,100,8,.28);
  --flame-wash:rgba(174,100,8,.10); --water:#2C6C81; --water-wash:rgba(44,108,129,.10);
  --rest:#CFD6DF; --shadow:0 1px 2px rgba(20,27,39,.05), 0 12px 28px -20px rgba(20,27,39,.35);
}

*{box-sizing:border-box}
body{
  background:var(--ink); color:var(--text);
  font-family:var(--body); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--flame);outline-offset:3px;border-radius:3px}

.app{max-width:452px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ── 上部 ─────────────────────────────────── */
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:22px 20px 14px; padding-top:calc(22px + env(safe-area-inset-top));
}
.today-date{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.01em;line-height:1.25}
.today-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);font-variant-numeric:tabular-nums}
.tally{display:flex;gap:14px;text-align:right}
.tally div{line-height:1.15}
.tally b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--flame);font-variant-numeric:tabular-nums}
.tally b.w{color:var(--water)}
.tally span{font-size:10px;letter-spacing:.1em;color:var(--faint)}

/* ── 本体 ─────────────────────────────────── */
main{flex:1;padding:6px 20px 132px}
.view{display:none;animation:rise .34s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;display:flex;align-items:center;gap:10px;margin:26px 0 12px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.eyebrow:first-child{margin-top:6px}

/* ── クエスト札 ───────────────────────────── */
.quest{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;
  transition:transform .5s cubic-bezier(.2,.7,.3,1), opacity .5s;
}
.quest.ascend{transform:translateY(-40px) scale(.96);opacity:0}
.q-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.q-title{font-family:var(--display);font-size:18px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.q-drop{font-family:var(--mono);font-size:16px;color:var(--faint);padding:0 4px;line-height:1;margin:-2px -4px 0 0}
.q-act{margin:9px 0 0;font-size:15.5px;font-weight:500;line-height:1.55;text-wrap:pretty}
.q-anchor{margin:5px 0 0;font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:baseline}
.q-anchor::before{content:"↳";color:var(--faint);font-family:var(--mono)}

/* 灯り列 */
.wick{display:flex;gap:7px;margin:15px 0 0;align-items:center}
.wick i{
  width:12px;height:12px;border-radius:50%;background:var(--rest);flex:none;
  border:1px solid transparent;transition:background .35s, box-shadow .35s;
}
.wick i.lit{background:var(--flame);box-shadow:0 0 0 3px var(--flame-wash),0 0 14px var(--flame-glow)}
.wick i.saved{background:transparent;border:1px dashed var(--flame);box-shadow:none}
.wick i.now{animation:kindle .9s ease both}
@keyframes kindle{
  0%{transform:scale(.2);opacity:0} 45%{transform:scale(1.5)} 100%{transform:scale(1);opacity:1}
}
.wick .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ともすボタン */
.light{
  margin-top:14px;width:100%;border:1px solid var(--flame);color:var(--flame);
  border-radius:3px;padding:11px;font-size:14px;font-weight:700;letter-spacing:.24em;
  transition:background .2s,color .2s,transform .1s;
}
.light:active{transform:scale(.985)}
.light:hover{background:var(--flame-wash)}
.light.done{
  border-color:var(--line);color:var(--dim);font-weight:500;letter-spacing:.16em;
  background:transparent;cursor:default;
}
.light.done:hover{background:transparent}
.q-note{margin:10px 0 0;font-size:12px;color:var(--water);font-family:var(--body)}
.q-note.warn{color:var(--flame)}

/* 空の枠 */
.slot{
  border:1px dashed var(--line);border-radius:4px;padding:22px 16px;text-align:center;
  color:var(--faint);font-size:13px;margin-bottom:12px;
}
.slot b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;margin-bottom:4px;color:var(--faint)}

/* ── つくる ───────────────────────────────── */
.seed{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:var(--shadow);
}
.seed label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);margin-bottom:8px;text-transform:uppercase}
textarea,input[type=text],input[type=password]{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;
  color:var(--text);font-family:var(--body);font-size:15px;padding:11px 12px;resize:none;line-height:1.6;
}
textarea::placeholder,input::placeholder{color:var(--faint)}
.btn{
  display:block;width:100%;margin-top:12px;background:var(--flame);color:var(--flame-ink);
  border-radius:3px;padding:13px;font-weight:700;font-size:14.5px;letter-spacing:.16em;
  transition:opacity .2s,transform .1s;
}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500;letter-spacing:.1em}
.row2{display:flex;gap:10px}
.hint{font-size:12px;color:var(--faint);margin:10px 2px 0;line-height:1.6}

/* ドラフト */
.pick{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:4px;padding:13px 14px;margin-bottom:9px;transition:border-color .2s,background .2s;
}
.pick[aria-pressed="true"]{border-color:var(--flame);background:var(--flame-wash)}
.pick .p-main{font-size:15px;font-weight:500;line-height:1.5}
.pick .p-sub{font-size:12px;color:var(--dim);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.pick.addbtn{border-style:dashed;color:var(--dim);font-size:14px;padding:12px 14px}
.pick.addbtn:hover{border-color:var(--flame);color:var(--flame);background:transparent}
.chip.addbtn{border-style:dashed}
.chip.addbtn:hover{border-color:var(--flame);color:var(--flame)}
input.free{margin-top:9px;border-style:dashed;background:transparent}
input.free:focus{border-style:solid;outline:none;border-color:var(--flame)}
input.free.on{border-style:solid;border-color:var(--flame);background:var(--flame-wash)}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--dim);
  transition:border-color .2s,color .2s,background .2s;
}
.chip[aria-pressed="true"]{border-color:var(--flame);color:var(--flame);background:var(--flame-wash)}
.thinking{
  display:flex;align-items:center;gap:11px;color:var(--dim);font-size:13.5px;padding:26px 4px;
}
.thinking i{width:9px;height:9px;border-radius:50%;background:var(--flame);animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.err{color:var(--flame);font-size:13px;margin:14px 2px 0;line-height:1.65}

/* 例 */
.sample{
  border:1px solid var(--line-soft);border-radius:4px;padding:14px 15px;margin-bottom:9px;background:transparent;
  display:block;width:100%;text-align:left;transition:border-color .2s,background .2s;
}
.sample:hover{border-color:var(--line);background:var(--surface)}
.sample .s-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.sample .s-title{font-family:var(--display);font-size:16px;font-weight:700;margin:3px 0 4px;letter-spacing:.01em}
.sample .s-act{font-size:13.5px;color:var(--dim);line-height:1.55}

/* ── 蔵 ───────────────────────────────────── */
.relic{
  display:flex;gap:13px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid var(--line-soft);
}
.relic .mark{
  width:10px;height:10px;border-radius:50%;background:var(--water);margin-top:8px;flex:none;
  box-shadow:0 0 0 3px var(--water-wash),0 0 12px rgba(134,186,203,.3);
}
.relic h4{font-family:var(--display);font-size:16px;font-weight:700;margin:0;letter-spacing:.01em}
.relic p{margin:3px 0 0;font-size:13px;color:var(--dim);line-height:1.55}
.relic time{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;display:block;margin-top:5px;font-variant-numeric:tabular-nums}
.empty{color:var(--faint);font-size:13.5px;line-height:1.9;padding:26px 2px;text-wrap:pretty}

/* ── タブ ─────────────────────────────────── */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .inner{max-width:452px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{position:relative;padding:11px 0 13px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);transition:color .2s}
.tab .glyph{font-family:var(--display);font-size:15px;font-weight:700;line-height:1}
.tab .name{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em}
.tab[aria-selected="true"]{color:var(--flame)}
.tab .badge{
  position:absolute;transform:translate(17px,-4px);width:5px;height:5px;border-radius:50%;background:var(--flame);
}

/* ── 演出 ─────────────────────────────────── */
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;
  background:radial-gradient(circle at 50% 60%, var(--flame-glow), transparent 62%)}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.5}100%{opacity:0}}

#whisper{
  position:fixed;left:0;right:0;top:44%;z-index:41;pointer-events:none;text-align:center;
  font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.06em;color:var(--flame);opacity:0;
  text-shadow:0 0 26px var(--flame-glow);padding:0 24px;text-wrap:balance;
}
#whisper.go{animation:whisper 2.6s ease both}
@keyframes whisper{
  0%{opacity:0;transform:translateY(10px)}
  22%{opacity:1;transform:none} 70%{opacity:1;transform:none} 100%{opacity:0;transform:translateY(-8px)}
}

#rite{
  position:fixed;inset:0;z-index:50;background:var(--ink);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 30px;text-align:center;
}
#rite.on{display:flex;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#rite .rite-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--water)}
#rite h2{font-family:var(--display);font-size:27px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
#rite .rite-act{font-size:14px;color:var(--dim);max-width:26em;line-height:1.75;margin:0}
#rite .rite-wick{display:flex;gap:9px;margin:4px 0}
#rite .rite-wick i{width:12px;height:12px;border-radius:50%;background:var(--flame);
  box-shadow:0 0 14px var(--flame-glow);animation:release 1.5s ease-in both}
@keyframes release{
  0%{transform:translateY(0);opacity:1;background:var(--flame)}
  100%{transform:translateY(-58px);opacity:0;background:var(--water)}
}
#rite .rite-line{font-size:14.5px;color:var(--water);letter-spacing:.01em;margin:0}
#rite button{margin-top:14px;border:1px solid var(--line);border-radius:3px;padding:12px 34px;
  font-size:13px;letter-spacing:.2em;color:var(--dim)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.sheet-bg.on{display:block;animation:fadein .2s ease both}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding:20px 20px 26px;
  padding-bottom:calc(26px + env(safe-area-inset-bottom));max-width:452px;margin:0 auto;display:none;
}
.sheet.on{display:block;animation:sheetup .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:.01em}
.sheet p{font-size:13px;color:var(--dim);margin:0 0 16px;line-height:1.65}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{margin-top:0}
.btn.danger{background:transparent;border:1px solid var(--flame);color:var(--flame)}

.cloud{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint);text-align:center;padding:22px 0 4px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div>
      <div class="today-date" id="dateJa">—</div>
      <div class="today-sub" id="dateSub">—</div>
    </div>
    <div class="tally">
      <div><b id="tLit">0</b><span>ともした日</span></div>
      <div><b class="w" id="tPure">0</b><span>浄めた数</span></div>
    </div>
  </header>

  <main>
    <!-- 今日 -->
    <section class="view on" id="view-today">
      <div class="eyebrow">いまの三つ</div>
      <div id="questList"></div>
    </section>

    <!-- つくる -->
    <section class="view" id="view-forge">
      <div class="eyebrow">身につけたいこと</div>
      <div class="seed">
        <label for="seedInput">ひとことで投げる</label>
        <textarea id="seedInput" rows="2" placeholder="早起きしたい / 本を読みたい / 家を片づけたい"></textarea>
        <button class="btn" id="draftBtn">クエストにする</button>
        <p class="hint" id="seedHint">1分で終わる行動と、くっつける先に割ります。</p>
      </div>
      <div id="draftArea"></div>
    </section>

    <!-- 蔵 -->
    <section class="view" id="view-vault">
      <div class="eyebrow">浄めたもの</div>
      <div id="vaultList"></div>

      <div class="eyebrow">設定</div>
      <div class="seed">
        <label for="keyInput">Anthropic APIキー（任意）</label>
        <input type="password" id="keyInput" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
        <button class="btn ghost" id="keySave">保存する</button>
        <p class="hint" id="keyNote"></p>
      </div>
      <div class="seed" style="margin-top:12px">
        <label for="ioBox">記録の持ち運び</label>
        <textarea id="ioBox" rows="3" placeholder="移す先では、ここに貼って「読み込む」"></textarea>
        <div class="row2">
          <button class="btn ghost" id="ioOut">書き出す</button>
          <button class="btn ghost" id="ioIn">読み込む</button>
        </div>
        <p class="hint" id="ioNote">端末を移すときに使います。</p>
      </div>
      <div class="cloud" id="cloudNote"></div>
    </section>
  </main>

  <nav class="tabbar">
    <div class="inner" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="today"><span class="glyph">火</span><span class="name">TODAY</span></button>
      <button class="tab" role="tab" aria-selected="false" data-view="forge"><span class="glyph">種</span><span class="name">FORGE</span></button>
      <button class="tab" role="tab" aria-selected="false" data-view="vault"><span class="glyph">蔵</span><span class="name">VAULT</span></button>
    </div>
  </nav>
</div>

<div id="flash"></div>
<div id="whisper"></div>

<div id="rite" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="rite-eyebrow">SEVEN DAYS</div>
  <div class="rite-wick" id="riteWick"></div>
  <h2 id="riteTitle">—</h2>
  <p class="rite-act" id="riteAct">—</p>
  <p class="rite-line">灯は空に還った。もう覚えなくていい。</p>
  <button id="riteClose">とじる</button>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h3 id="sheetTitle">このクエストをやめる</h3>
  <p id="sheetBody">灯した記録も消えます。枠はすぐ空きます。</p>
  <div class="row">
    <button class="btn ghost" id="sheetCancel">もどる</button>
    <button class="btn danger" id="sheetOk">やめる</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ── 状態 ─────────────────────────────── */
var KEY="nanoka.v1", KEYK="nanoka.key", APPV="v1", GOAL=7, SLOTS=3;
/* claude.ai版で灯していた記録。この端末で初めて開いたときだけ引き継ぐ。 */
var MIGRATE={"v": 1, "updatedAt": 1788779985308, "quests": [{"id": "qmtr5exjyl84", "title": "発声習慣", "action": "「あー」と3秒発声する", "anchor": "朝歯磨きをしたら", "cheer": "よし", "streak": 1, "last": "2026-09-07", "grace": 1, "born": "2026-09-07", "note": "", "noteWarn": false}], "archive": [], "lit": 1};
var state = load();
try{ if(localStorage.getItem(KEY)===null){ state=MIGRATE; localStorage.setItem(KEY, JSON.stringify(state)); } }catch(e){}

function blank(){ return {v:1, updatedAt:0, quests:[], archive:[], lit:0}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return blank();
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.quests)) return blank();
    s.archive=s.archive||[]; s.lit=s.lit||0; s.updatedAt=s.updatedAt||0;
    return s;
  }catch(e){ return blank(); }
}

}

/* ── 日付 ─────────────────────────────── */
function key(d){
  d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function toDate(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function gap(a,b){ return Math.round((toDate(a)-toDate(b))/86400000); } // a が b の何日後か
var WD=["日","月","火","水","木","金","土"];
function stamp(){
  var d=new Date();
  document.getElementById("dateJa").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）";
  document.getElementById("dateSub").textContent=key(d);
}

/* ── 灯す ─────────────────────────────── */
function kindle(id){
  var q=state.quests.filter(function(x){return x.id===id;})[0];
  if(!q) return;
  var t=key();
  if(q.last===t) return;

  var broke=false, usedGrace=false;
  if(!q.last){ q.streak=1; }
  else{
    var d=gap(t,q.last);
    if(d===1){ q.streak++; }
    else if(d===2 && q.grace>0){ q.grace--; q.streak++; usedGrace=true; }
    else{ q.streak=1; broke=true; }
  }
  q.last=t; state.lit++;

  q.note = broke ? "灯が絶えていた。いま、1本目からやり直し。"
        : usedGrace ? "お守りを1つ使って、列をつないだ。"
        : "";
  q.noteWarn = broke;

  if(q.streak>=GOAL){
    purify(q);
  }else{
    save(); renderToday(id); renderTally(); renderBadge();
    flash(); whisper(q.cheer);
  }
}

function purify(q){
  var card=document.querySelector('.quest[data-id="'+q.id+'"]');
  if(card) card.classList.add("ascend");
  state.quests=state.quests.filter(function(x){return x.id!==q.id;});
  state.archive.push({title:q.title, action:q.action, anchor:q.anchor, cheer:q.cheer, done:key()});
  save();
  flash();
  setTimeout(function(){ rite(q); renderToday(); renderTally(); renderBadge(); renderVault(); }, 520);
}

  var w=document.getElementById("riteWick"), h="";
  for(var i=0;i<GOAL;i++) h+='<i style="animation-delay:'+(i*0.09)+'s"></i>';
  w.innerHTML=h;
  document.getElementById("riteTitle").textContent=q.title;
  document.getElementById("riteAct").textContent=q.action+"　／　"+q.anchor;
  var r=document.getElementById("rite"); r.classList.add("on"); r.setAttribute("aria-hidden","false");
}

"ユーザーが身につけたいことを、次の三点セットのクエストに落としてください。\n"+
"1) 1分以内で必ず終わる最小行動。準備・道具・場所の移動が要らないこと。「5分」「10回」など1分を超える提案は禁止。\n"+
"2) すでに毎日やっている行動への接続点（アンカー）。その行動の直後に差し込める具体的な場面。\n"+
"提案は誇張・励まし口調・絵文字を使わず、淡々と書いてください。\n\n";

function promptFor(seed){

  '{"title":"クエスト名。8文字以内の体言止め","actions":[{"text":"1分で終わる具体的な行動。20文字以内","note":"なぜこれで足りるのか。25文字以内"}],"anchors":["すでにやっている日常行動。14文字以内、「〜したら」「〜の前に」の形"]}\n'+
  "actionsは3つ、anchorsは4つ。すべて日本語。";

function apiKey(){ try{ return localStorage.getItem(KEYK)||""; }catch(e){ return ""; } }

/* 自分のAPIキーでClaudeに下書きを頼む。キーはこの端末のブラウザにだけ置かれ、
   送り先は api.anthropic.com のみ。 */
function callClaude(prompt){
  var key=apiKey();
  if(!key) return Promise.reject({code:"no_key"});
  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:"claude-opus-5",
      max_tokens:4000,
      output_config:{effort:"low"},
      messages:[{role:"user",content:prompt}]
    })
  }).then(function(r){
    if(r.status===401||r.status===403) return Promise.reject({code:"auth"});
    if(r.status===429) return Promise.reject({code:"rate_limited"});
    if(!r.ok) return Promise.reject({code:"http"});
    return r.json();
  },function(){ return Promise.reject({code:"network"}); })
  .then(function(res){
    if(res && res.stop_reason==="refusal") return Promise.reject({code:"refusal"});
    var text=(res.content||[]).filter(function(b){return b.type==="text";})
      .map(function(b){return b.text||"";}).join("");
    return pickJson(text);
  });
}
function pickJson(t){
  if(!t) throw {code:"invalid_json"};
  var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);
  var body=m?m[1]:t;
  var a=body.indexOf("{"), b=body.lastIndexOf("}");
  if(a<0||b<=a) throw {code:"invalid_json"};
  try{ return JSON.parse(body.slice(a,b+1)); }catch(e){ throw {code:"invalid_json"}; }
}

function askClaude(seed){
  var area=document.getElementById("draftArea");
  area.innerHTML='<div class="thinking"><i></i><span>1分に割っています…</span></div>';
  document.getElementById("draftBtn").disabled=true;
  callClaude(promptFor(seed)).then(function(d){
    document.getElementById("draftBtn").disabled=false;
    if(!d||!d.actions||!d.actions.length) throw {code:"invalid_json"};
    draft={
      title:String(d.title||seed).slice(0,20),
      actions:(d.actions||[]).slice(0,3).map(function(a){
        return typeof a==="string" ? {text:a,note:""} : {text:String(a.text||""),note:String(a.note||"")};
      }).filter(function(a){return a.text;}),
      anchors:(d.anchors||[]).slice(0,4).map(String).filter(Boolean)
    };
    picked={action:0, anchor:0}; free={action:"",anchor:"",openA:false,openN:false};
    renderDraft(seed);
  }).catch(function(e){
    document.getElementById("draftBtn").disabled=false;
    var code=e&&e.code;
    if(code==="no_key"){ manualForm(seed, "APIキーが未設定です。蔵タブの設定に入れると、下書きが作れます。"); return; }
    var msg = code==="auth" ? "APIキーが通りませんでした。蔵タブの設定で確認してください。"
            : code==="rate_limited" ? "少し立て込んでいます。ひと呼吸おいて、もう一度。"
            : code==="network" ? "通信できませんでした。電波を確かめて、もう一度。"
            : "下書きに失敗しました。自分で書いても、結果は同じです。";
    manualForm(seed, msg);
  });
}

  });

    : '<button class="pick addbtn" data-freea>＋　自分で書く</button>';
  h+='<div class="eyebrow">くっつける先</div><div class="chips">';
  draft.anchors.forEach(function(a,i){

  });

  h+="</div>";

  h+='<button class="btn" id="acceptBtn" style="margin-top:24px">この一手で始める</button>'+
     '<p class="hint">7日連続でともせば浄化。1日だけの抜けは、お守り1つで埋められます。</p>';
  document.getElementById("draftArea").innerHTML=h;

function draftClick(e){
  if(e.target.closest("[data-freea]")){
    free.openA=true; picked.action=-1; renderDraft(lastSeed);
    var fa=document.getElementById("freeAction"); if(fa) fa.focus();
    return;
  }
  if(e.target.closest("[data-freen]")){
    free.openN=true; picked.anchor=-1; renderDraft(lastSeed);
    var fn=document.getElementById("freeAnchor"); if(fn) fn.focus();
    return;
  }
  var a=e.target.closest("[data-pa]"), n=e.target.closest("[data-pn]");
  if(a){ picked.action=+a.getAttribute("data-pa"); syncPicks(); return; }
  if(n){ picked.anchor=+n.getAttribute("data-pn"); syncPicks(); return; }
  if(e.target.closest("#acceptBtn")){
    var t=(document.getElementById("dTitle").value||"").trim();
    var act=picked.action===-1 ? free.action.trim() : (draft.actions[picked.action]||{}).text;
    var anc=picked.anchor===-1 ? free.anchor.trim() : draft.anchors[picked.anchor];
    if(!act){
      free.openA=true; picked.action=-1; renderDraft(lastSeed);
      var fx=document.getElementById("freeAction"); if(fx) fx.focus();
      return;
    }
    startQuest({title:t||act.slice(0,10), action:act, anchor:anc||"思い出したら", cheer:"よし"});
  }
}

  document.querySelectorAll("[data-pa]").forEach(function(el){

  document.querySelectorAll("[data-pn]").forEach(function(el){
    el.setAttribute("aria-pressed", (+el.getAttribute("data-pn")===picked.anchor)+"" ); });
  var fa=document.getElementById("freeAction"), fn=document.getElementById("freeAnchor");
  if(fa) fa.classList.toggle("on", picked.action===-1);

  var b=document.getElementById("ioBox");
  b.value=JSON.stringify(state); b.focus(); b.select();
  document.getElementById("ioNote").textContent="この文字列を控えて、移す先の同じ欄に貼ってください。";
});
document.getElementById("ioIn").addEventListener("click",function(){
  var b=document.getElementById("ioBox"), t=b.value.trim();
  if(!t) return;
  try{
    var o=JSON.parse(t);
    if(!o || !Array.isArray(o.quests)) throw 0;
    o.archive=o.archive||[]; o.lit=o.lit||0;
    state=o; save(); renderAll(); forgeIntro();
    b.value=""; document.getElementById("ioNote").textContent="読み込みました。";
  }catch(e){
    document.getElementById("ioNote").textContent="読み込めませんでした。文字列を確かめてください。";
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
