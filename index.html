<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ember</title>
<meta name="description" content="1分の行動を7日ともし切ると、手をかけなくても燃えている。">
<meta name="theme-color" content="#07080B">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ember">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ── 黒に、光。明暗で切り替えず、この一つの世界に決める。 */
:root{
  --paper:#07080B;
  --sheet:#0E1014;
  --sheet2:#151920;
  --edge:#1E222B;
  --rule:#2B303A;
  --sumi:#EDE8DE;
  --sumi2:#9A9488;
  --sumi3:#5E6470;
  --lit:#FFB24D;
  --hot:#FFE7B8;
  --bloom:rgba(255,166,56,.30);
  --bloom-soft:rgba(255,166,56,.09);
  --bloom-cell:rgba(255,178,77,.72);
  --fiber:rgba(226,214,186,.028);
  --body:"Zen Kaku Gothic New",'Hiragino Sans',system-ui,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
/* 指で掴む画面。文字選択と長押しメニューは邪魔になる。 */
.pane,.layer,.lines,.dots{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--sumi);
  font-family:var(--body); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--lit);outline-offset:4px;border-radius:2px}

/* 周辺の言葉は小文字の英語で、小さく置く */
.en{
  font-family:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
  text-transform:lowercase; letter-spacing:.16em; font-weight:400;
}

/* ── 三面 ────────────────────────────────────────────── */
.pager{
  display:flex; height:100dvh; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; overscroll-behavior:contain; scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.pane{
  flex:0 0 100%; min-width:100%; height:100dvh;
  scroll-snap-align:center; scroll-snap-stop:always;
  display:flex; flex-direction:column;
}
#pane-today{position:relative; overflow:hidden; touch-action:pan-x}
#tToday.off{transform:scale(.985)}
#tQueue.off{transform:translateY(40px)}
#tDone.off{transform:translateY(-40px)}
/* 記入面は縦に流さない。指の動きでそのまま入れ替える。 */
#pane-new{position:relative; overflow:hidden; touch-action:pan-x}
.layer{
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
  padding:0 30px; will-change:transform;
  transition:opacity .3s ease, transform .34s cubic-bezier(.2,.85,.3,1);
}
.layer > .in{max-width:400px; width:100%; margin:0 auto; position:relative; z-index:1}
.layer.off{opacity:0; pointer-events:none}
#wWrite.off{transform:translateY(30px) scale(.985)}
#wLives.off{transform:translateY(-38px)}

/* 押すところを、真ん中にひとつだけ置く。 */
.orbwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.orb{
  position:relative; width:124px; height:124px; border-radius:50%;
  border:1px solid var(--rule);
  background:radial-gradient(64% 64% at 50% 56%, var(--sheet), transparent 72%);
  animation:orbbreathe 4.6s ease-in-out infinite;
  transition:border-color .3s, transform .18s;
}
.orb::after{
  content:""; position:absolute; inset:-18px; border-radius:50%; pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, var(--bloom-soft), transparent 70%);
}
@keyframes orbbreathe{
  0%,100%{box-shadow:0 0 14px var(--bloom-soft)}
  50%{box-shadow:0 0 34px var(--bloom)}
}
.orb:active{transform:scale(.96)}
.orb:hover{border-color:var(--lit)}
.orb.full{animation:none;opacity:.38}
.orblab{color:var(--sumi3);font-size:10px}
#pane-dash{overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y; padding:0 28px}

/* ── 今日の三行 ──────────────────────────────────────── */
#tToday .in{
  display:flex; flex-direction:column; position:relative;
  height:min(74dvh, 620px); justify-content:center;
}
.lines{flex:1; display:flex; flex-direction:column; justify-content:space-evenly}
.row{position:relative}
.line{position:relative;display:block;width:100%;text-align:left;padding:6px 0}
.line .glow{
  position:absolute; left:-44px; right:-44px; top:-40px; bottom:-24px; pointer-events:none;
  background:radial-gradient(52% 58% at 50% 50%, var(--bloom), transparent 78%);
  opacity:0; transition:opacity 1.1s ease;
}
.line.on .glow{opacity:1}
.line .txt{
  position:relative; display:block; font-size:21px; font-weight:500; line-height:1.55;
  letter-spacing:.005em; color:var(--sumi); transition:color .7s ease; text-wrap:pretty;
  padding-right:46px;
}
.line.on .txt{color:var(--lit);text-shadow:0 0 22px var(--bloom)}
.line .when{
  position:relative; display:block; margin-top:7px;
  font-size:12.5px; line-height:1.5; color:var(--sumi3); font-weight:400;
}
.line.on .when{color:var(--sumi2)}
.wick{position:relative;display:flex;gap:6px;margin-top:20px}
.wick i{flex:1;height:2px;border-radius:1px;background:var(--rule);
  transition:background .6s ease, box-shadow .6s ease}
.wick i.f{background:var(--lit);box-shadow:0 0 12px var(--bloom),0 0 3px var(--lit)}
.wick i.now{animation:kindle 1s ease both}
@keyframes kindle{0%{transform:scaleX(0);opacity:0}60%{transform:scaleX(1.02)}100%{transform:none;opacity:1}}
.blank{height:2px;background:var(--rule);opacity:.4}

/* 待ち／浄めたもの の一覧 */
.listhead{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;color:var(--sumi3);font-size:10px}
.listhead button{border:1px solid var(--edge);border-radius:999px;
  padding:7px 14px;font-size:10px;color:var(--sumi2)}
.listhead button:hover{border-color:var(--lit);color:var(--lit)}
.list{max-height:66dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.list::-webkit-scrollbar{display:none}
.qrow{padding:15px 0;border-bottom:1px solid var(--edge)}
.qrow .qt{font-size:16.5px;line-height:1.5;color:var(--sumi)}
.qrow .qw{margin-top:5px;font-size:12px;color:var(--sumi3)}
.qrow .qb{display:flex;gap:8px;margin-top:11px;align-items:center}
.qrow .qb button{border:1px solid var(--edge);border-radius:999px;
  padding:7px 14px;font-size:10px;color:var(--sumi2)}
.qrow .qb button:hover{border-color:var(--lit);color:var(--lit)}
.qrow .qb time{margin-left:auto;color:var(--sumi3);font-size:10px;font-variant-numeric:tabular-nums}
.swap{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.swap .cap{color:var(--sumi3);font-size:10px}
.swap button{text-align:left;border:1px solid var(--edge);border-radius:2px;
  padding:11px 13px;font-size:14.5px;color:var(--sumi2);line-height:1.4}
.swap button:hover{border-color:var(--lit);color:var(--hot);box-shadow:0 0 18px var(--bloom-soft)}
.edgehint{position:absolute;left:0;right:0;text-align:center;
  color:var(--sumi3);font-size:9.5px;opacity:.6;pointer-events:none}
.edgehint.top{top:-30px}
.edgehint.bot{bottom:-30px}

/* 直す。灯すと取り違えないよう、離して置く。 */
.fix{
  position:absolute; right:-8px; top:0; padding:8px 8px 10px;
  color:var(--sumi3); font-size:9.5px; line-height:1;
}
.fix:hover{color:var(--lit)}
.undo{
  display:flex; align-items:center; gap:10px; margin-top:12px;
  color:var(--sumi3); font-size:10px;
}
.undo button{border:1px solid var(--edge);border-radius:999px;padding:6px 13px;
  font-size:10px;color:var(--sumi2)}
.undo button:hover{border-color:var(--lit);color:var(--lit)}

.foot{height:44px;display:flex;align-items:center;justify-content:center}
.tip{color:var(--sumi3);font-size:11px}
.nudge{
  position:absolute; left:6px; top:50%; transform:translateY(-50%);
  color:var(--sumi3); font-size:30px; line-height:1; animation:sway 2.8s ease-in-out infinite;
}
@keyframes sway{0%,100%{transform:translate(0,-50%);opacity:.3}50%{transform:translate(-7px,-50%);opacity:.75}}

/* ── 記入 ────────────────────────────────────────────── */
.lab{display:block;color:var(--sumi3);font-size:10px;margin-bottom:9px}
#actIn,#ancIn{
  width:100%; background:transparent; border:0; border-bottom:2px solid var(--rule);
  color:var(--sumi); font-family:var(--body); line-height:1.5; padding:5px 0 11px; resize:none;
}
#actIn{font-size:21px}
#ancIn{font-size:16px;border-bottom-width:1px;color:var(--sumi2)}
#actIn::placeholder,#ancIn::placeholder{color:var(--sumi3)}
#actIn:focus,#ancIn:focus{outline:none;border-bottom-color:var(--lit)}
.gap{margin-top:26px}
.keep{
  display:block; width:100%; margin-top:30px; border:1px solid var(--edge);
  border-radius:2px; padding:13px; font-size:11px; color:var(--sumi2);
  transition:color .2s,border-color .2s,box-shadow .35s,background .2s;
}
.keep.ready{color:var(--lit);border-color:var(--lit);box-shadow:0 0 20px var(--bloom-soft)}
.keep:active{background:var(--sheet2)}
.pull{margin-top:22px;text-align:center;color:var(--sumi3);font-size:10px;opacity:.75}
.pull span{display:block;font-size:15px;margin-bottom:3px;animation:sway2 2.6s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(4px);opacity:.9}}

/* 背景をよぎる、すでにある一日 */
.drift{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.drift .lane{display:flex;gap:26px;width:max-content;white-space:nowrap;
  color:var(--sumi3);font-size:15px;opacity:.13;
  animation:drift var(--s) linear infinite}
/* 書く場所だけは、流れの上に浮かせて読ませる。 */
#entry .in::before{
  content:"";position:absolute;inset:-40px -26px;z-index:-1;border-radius:40px;
  background:radial-gradient(58% 46% at 50% 50%, var(--paper) 62%, transparent 100%);
}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── 記録された習慣（上に置く）─────────────────────── */
.lifecard{position:relative;max-width:400px;width:100%;margin:0 auto}
.lifecard .who{color:var(--lit);font-size:11px;letter-spacing:.16em}
.lifecard .what{color:var(--sumi3);font-size:10.5px;margin-top:4px}
.lifecard .did{margin-top:20px;font-size:19px;line-height:1.7;color:var(--sumi);text-wrap:pretty}
.lifecard.flip{animation:deal .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes deal{
  0%{opacity:0;transform:translateY(-34px) rotate(-1.2deg)}
  70%{opacity:1;transform:translateY(4px) rotate(.3deg)}
  100%{opacity:1;transform:none}
}
.lifeglow{position:absolute;left:-40px;right:-40px;top:-60px;bottom:-60px;pointer-events:none;
  background:radial-gradient(44% 50% at 40% 40%, var(--bloom-soft), transparent 72%)}

/* ── 記録 ────────────────────────────────────────────── */
#pane-dash > .in{max-width:400px;width:100%;margin:0 auto;
  padding-top:calc(46px + env(safe-area-inset-top)); padding-bottom:140px}
.today{font-size:19px;font-weight:700;letter-spacing:.01em}
.sub{margin-top:2px;color:var(--sumi3);font-size:10.5px;font-variant-numeric:tabular-nums}
.nums{display:flex;gap:30px;margin-top:30px}
.nums div{line-height:1.25}
.nums b{display:block;font-size:24px;font-weight:700;color:var(--lit);font-variant-numeric:tabular-nums}
.nums span{font-size:10px;color:var(--sumi3)}
.mark{
  margin:46px 0 16px;color:var(--sumi3);font-size:10.5px;
  display:flex;align-items:center;gap:12px;
}
.mark::after{content:"";flex:1;height:1px;background:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1;border-radius:2px;background:var(--sheet);border:1px solid var(--edge)}
.cell .f{position:absolute;inset:-2px;border-radius:3px;
  background:radial-gradient(62% 62% at 50% 50%, var(--bloom-cell), transparent 76%)}
.cell.today{border-color:var(--sumi3)}
.relic{display:flex;gap:14px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--edge)}
.relic .d{width:7px;height:7px;border-radius:50%;background:var(--lit);
  box-shadow:0 0 8px var(--bloom);flex:none;transform:translateY(-1px)}
.relic p{margin:0;font-size:15.5px;line-height:1.5}
.relic time{margin-left:auto;color:var(--sumi3);font-size:10.5px;font-variant-numeric:tabular-nums;flex:none}
.none{color:var(--sumi3);font-size:11px}

.set label{display:block;color:var(--sumi3);font-size:10.5px;margin-bottom:9px}
.set input,.set textarea{
  width:100%;background:var(--sheet);border:1px solid var(--edge);border-radius:2px;
  color:var(--sumi);font-family:var(--body);font-size:14px;padding:11px 12px;resize:none;
}
.set input:focus,.set textarea:focus{outline:none;border-color:var(--lit)}
.set .b{margin-top:12px;display:flex;gap:9px}
.set .b button{
  flex:1;border:1px solid var(--edge);border-radius:2px;padding:11px;
  font-size:11px;color:var(--sumi2);
}
.set .b button:hover{border-color:var(--lit);color:var(--lit)}
.set p{margin:12px 0 0;color:var(--sumi3);font-size:11px;line-height:1.7;letter-spacing:.04em}

/* 気づきを溜める。その場で直さない。 */
.note{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--edge)}
.note time{color:var(--sumi3);font-size:10px;font-variant-numeric:tabular-nums;flex:none;
  width:44px;padding-top:3px}
.note p{margin:0;flex:1;font-size:14.5px;line-height:1.6;color:var(--sumi2)}
.note button{color:var(--sumi3);font-size:14px;padding:0 4px;flex:none}
.note button:hover{color:var(--lit)}

/* ── 位置（点を押しても移れる）─────────────────────── */
.dots{
  position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;z-index:6;
}
.dots button{padding:14px 11px;line-height:0}
.dots span{display:block;width:6px;height:6px;border-radius:50%;background:var(--rule);
  transition:background .3s, transform .3s}
.dots button.on span{background:var(--lit);transform:scale(1.3)}

/* ── 演出 ────────────────────────────────────────────── */
#whisper{
  position:fixed;left:0;right:0;top:42%;z-index:40;pointer-events:none;text-align:center;
  font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--lit);opacity:0;
}
#whisper.go{animation:whisper 2.2s ease both}
@keyframes whisper{
  0%{opacity:0;transform:translateY(8px)} 20%{opacity:1;transform:none}
  62%{opacity:1;transform:none} 100%{opacity:0;transform:translateY(-6px)}
}
#rite{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:0 34px;background:var(--paper);
}
#rite.on{display:flex;animation:ritein .5s ease both}
@keyframes ritein{from{opacity:0}to{opacity:1}}
#rite .up{
  position:relative;text-align:center;font-size:21px;font-weight:500;color:var(--lit);
  animation:rise 2.2s cubic-bezier(.3,.7,.3,1) both;
}
#rite .up::before{
  content:"";position:absolute;left:-60px;right:-60px;top:-70px;bottom:-70px;
  background:radial-gradient(50% 50% at 50% 50%, var(--bloom), transparent 70%);
}
@keyframes rise{
  0%{opacity:0;transform:translateY(16px)}
  22%{opacity:1;transform:none} 66%{opacity:1;transform:translateY(-8px)}
  100%{opacity:0;transform:translateY(-42px)}
}

/* ── 直す ────────────────────────────────────────────── */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none}
.sheet-bg.on{display:block;animation:ritein .2s ease both}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:452px;margin:0 auto;display:none;
  background:var(--sheet);border-top:1px solid var(--edge);border-radius:10px 10px 0 0;
  padding:26px 26px calc(28px + env(safe-area-inset-bottom));
}
.sheet.on{display:block;animation:up .24s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet label{display:block;color:var(--sumi3);font-size:10.5px;margin:0 0 8px}
.sheet .f2{margin-top:20px}
.sheet input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--edge);
  color:var(--sumi);font-family:var(--body);font-size:18px;padding:4px 0 10px;
}
.sheet input.sm{font-size:14px;color:var(--sumi2)}
.sheet input:focus{outline:none;border-bottom-color:var(--lit)}
.sheet .b{display:flex;gap:10px;margin-top:28px}
.sheet .b button{flex:1;border:1px solid var(--edge);border-radius:2px;padding:13px;
  font-size:11px;color:var(--sumi2)}
.sheet .b button.keepb{border-color:var(--lit);color:var(--lit)}
.sheet .out{width:100%;margin-top:10px;border:1px solid var(--edge);border-radius:2px;
  padding:11px;font-size:11px;color:var(--sumi3)}
.sheet .out:hover{border-color:var(--lit);color:var(--lit)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="pager" id="pager">

  <!-- 記入（上に、記録された習慣） -->
  <section class="pane" id="pane-new">
    <div class="drift" id="drift" aria-hidden="true"></div>

    <div class="layer" id="wWrite">
      <div class="in">
        <div class="orbwrap" id="orbWrap">
          <button class="orb" id="orb" aria-label="write"></button>
          <div class="orblab en" id="orbLab">tap to write</div>
        </div>

        <div id="form" hidden>
          <label class="lab en" for="actIn">one minute</label>
          <textarea id="actIn" rows="2" placeholder="1分で終わること" autocomplete="off"></textarea>
          <div class="gap">
            <label class="lab en" for="ancIn">after what</label>
            <input type="text" id="ancIn" placeholder="歯みがきのあと" autocomplete="off">
          </div>
          <button class="keep en" id="keepBtn">keep</button>
        </div>

        <div class="pull en"><span>↓</span>pull down for others' habits</div>
      </div>
    </div>

    <div class="layer off" id="wLives">
      <div class="in">
        <span class="lifeglow"></span>
        <div class="lifecard" id="lifecard"></div>
        <div class="pull en"><span>↑</span>swipe up to write · pull down for the next</div>
      </div>
    </div>
  </section>

  <!-- 今日（上に浄めたもの、下に待ち） -->
  <section class="pane" id="pane-today">
    <div class="layer off" id="tDone">
      <div class="in">
        <div class="listhead"><span class="en">cleared</span><button class="en" data-back>back</button></div>
        <div class="list" id="doneList"></div>
      </div>
    </div>

    <div class="layer" id="tToday">
      <div class="in">
        <div class="edgehint top en" id="hintTop"></div>
        <div class="lines" id="lines"></div>
        <div class="foot" id="foot"></div>
        <div class="edgehint bot en" id="hintBot"></div>
      </div>
    </div>

    <div class="layer off" id="tQueue">
      <div class="in">
        <div class="listhead"><span class="en">waiting</span><button class="en" data-back>back</button></div>
        <div class="list" id="queueList"></div>
      </div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="pane" id="pane-dash">
    <div class="in">
      <div class="today" id="dToday">—</div>
      <div class="sub en" id="dSub">—</div>
      <div class="nums">
        <div><b id="nLit">0</b><span class="en">lit</span></div>
        <div><b id="nPure">0</b><span class="en">released</span></div>
        <div><b id="nRun">0</b><span class="en">in a row</span></div>
      </div>

      <div class="mark en">days</div>

<script>
(function(){
"use strict";

var KEY="nanoka.v1", GOAL=7, SLOTS=3;

/* ── すでにある一日。背景を流れ、くっつけ先の下敷きになる。 */
var HINTS=[

/* ── 記録に残っている、人の習慣。思い浮かばないときにめくる。 */
var LIVES=[

   "机に時計を置き、15分ごとの速度を決めて毎朝書いた。役所勤めのまえに。",
   "時計を机に置く"],
  ["JOHN GRISHAM","作家",
   "弁護士として働きながら、始業まえに一日一ページだけ書いた。",
   "出勤まえに一行書く"],

/* ── 状態 ─────────────────────────────── */
function blank(){ return {v:1,updatedAt:0,quests:[],queue:[],archive:[],lit:0,days:{},taught:false,notes:[]}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw===null) return blank();
    var s=JSON.parse(raw);
    if(!s || !Array.isArray(s.quests)) return blank();
    s.archive=s.archive||[]; s.lit=s.lit||0; s.updatedAt=s.updatedAt||0;
    s.taught=!!s.taught; s.days=s.days||{}; s.notes=s.notes||[]; s.queue=s.queue||[];
    return s;
  }catch(e){ return blank(); }
}
var state=load();
function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function find(id){ var q=null; state.quests.forEach(function(x){ if(x.id===id) q=x; }); return q; }

/* ── 日付 ─────────────────────────────── */
function key(d){
  d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function toDate(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function gap(a,b){ return Math.round((toDate(a)-toDate(b))/86400000); }
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ── 今日の三行 ───────────────────────── */
function lineHtml(q, justNow){
  var on=q.last===key(), w="";
  for(var i=0;i<GOAL;i++){
    var c=i<q.streak?"f":"";
    if(justNow && i===q.streak-1) c+=" now";
    w+='<i class="'+c+'"></i>';
  }
  return '<div class="row">'+
    '<button class="line'+(on?" on":"")+'" data-id="'+q.id+'" aria-pressed="'+on+'">'+
      '<span class="glow"></span>'+
      '<span class="txt">'+esc(q.action)+"</span>"+
      (q.anchor?'<span class="when">'+esc(q.anchor)+"</span>":"")+
      '<span class="wick">'+w+"</span></button>"+
    '<button class="fix en" data-fix="'+q.id+'">edit</button>'+
  "</div>";
}
function renderLines(justNowId){
  var h="";
  state.quests.forEach(function(q){ h+=lineHtml(q, q.id===justNowId); });
  for(var i=state.quests.length;i<SLOTS;i++) h+='<div class="blank"></div>';
  document.getElementById("lines").innerHTML=h;

  var foot=document.getElementById("foot");
  if(undoData){
    foot.innerHTML='<div class="undo"><span class="en">lit just now</span>'+
                   '<button class="en" id="undoBtn">undo</button></div>';
  }else if(!state.quests.length){
    foot.innerHTML='<div class="nudge">‹</div>';
  }else if(!state.taught){
    foot.innerHTML='<div class="tip en">touch to light · edit to change</div>';
  }else foot.innerHTML="";
  renderEdges();
}

/* ── 待ち／浄めたもの ─────────────────── */
function renderEdges(){
  var top=document.getElementById("hintTop"), bot=document.getElementById("hintBot");
  top.textContent = state.archive.length ? "↓ "+state.archive.length+" cleared" : "";
  bot.textContent = state.queue.length ? "↑ "+state.queue.length+" waiting" : "";
}

function renderQueue(){
  var box=document.getElementById("queueList");
  if(!state.queue.length){
    box.innerHTML='<p class="none en">nothing waiting.</p>';
  }else{
    var h="";
    state.queue.forEach(function(q,i){
      h+='<div class="qrow" data-q="'+i+'">'+
         '<div class="qt">'+esc(q.action)+"</div>"+
         (q.anchor?'<div class="qw">'+esc(q.anchor)+"</div>":"")+
         '<div class="qb"><button class="en" data-set="'+i+'">set</button>'+
         '<button class="en" data-qdrop="'+i+'">let go</button></div>'+
         '<div class="swap" data-swap="'+i+'" hidden></div></div>';
    });
    box.innerHTML=h;
  }
  renderEdges();
}

function renderDone(){
  var box=document.getElementById("doneList");
  if(!state.archive.length){
    box.innerHTML='<p class="none en">nothing cleared yet.</p>';
  }else{
    var h="";
    state.archive.slice().reverse().forEach(function(a,i){
      var idx=state.archive.length-1-i;
      h+='<div class="qrow">'+
         '<div class="qt">'+esc(a.action)+"</div>"+
         (a.anchor?'<div class="qw">'+esc(a.anchor)+"</div>":"")+
         '<div class="qb"><button class="en" data-back-in="'+idx+'">bring back</button>'+
         "<time>"+esc(a.done)+"</time></div></div>";
    });
    box.innerHTML=h;
  }
  renderEdges();
}

/* 待ちの一つを、三つのどれかに据える。空きがあればそのまま。 */
function setFromQueue(i, swapId){
  var q=state.queue[i];
  if(!q) return;
  if(state.quests.length<SLOTS){
    state.queue.splice(i,1);
    state.quests.push(q);
  }else{
    if(!swapId) return;
    var out=null;
    state.quests=state.quests.filter(function(x){
      if(x.id===swapId){ out=x; return false; }
      return true;
    });
    if(!out) return;
    state.queue.splice(i,1);
    state.quests.push(q);
    state.queue.unshift(out);          /* 外したものは待ちの先頭へ。記録はそのまま */
  }
  save(); renderLines(); renderQueue(); tMode("today");
}

document.getElementById("queueList").addEventListener("click",function(e){
  var setB=e.target.closest("[data-set]"), dropB=e.target.closest("[data-qdrop]"),
      pick=e.target.closest("[data-pick]");
  if(pick){ setFromQueue(+pick.getAttribute("data-qi"), pick.getAttribute("data-pick")); return; }
  if(dropB){
    state.queue.splice(+dropB.getAttribute("data-qdrop"),1);
    save(); renderQueue(); return;
  }
  if(setB){
    var i=+setB.getAttribute("data-set");
    if(state.quests.length<SLOTS){ setFromQueue(i); return; }
    var box=document.querySelector('[data-swap="'+i+'"]');
    if(!box) return;
    if(!box.hidden){ box.hidden=true; return; }
    var h='<div class="cap en">which one steps out?</div>';
    state.quests.forEach(function(q){
      h+='<button data-pick="'+q.id+'" data-qi="'+i+'">'+esc(q.action)+"</button>";
    });
    box.innerHTML=h; box.hidden=false;
  }
});

document.getElementById("doneList").addEventListener("click",function(e){
  var b=e.target.closest("[data-back-in]");
  if(!b) return;
  var idx=+b.getAttribute("data-back-in"), a=state.archive[idx];
  if(!a) return;
  state.archive.splice(idx,1);
  var q={ id:"q"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title:a.title||a.action, action:a.action, anchor:a.anchor||"", cheer:"よし",
    streak:0, last:null, grace:1, born:key() };
  if(state.quests.length<SLOTS) state.quests.push(q); else state.queue.push(q);
  save(); renderLines(); renderQueue(); renderDone(); renderDash(); tMode("today");
});

/* ── 灯す。押し間違いから戻れるようにしておく。 ───────── */
var undoData=null, undoTimer=null;
function kindle(id){
  var q=find(id), t=key();
  if(!q || q.last===t) return;

  var before={id:id, last:q.last, streak:q.streak, grace:q.grace};
  if(!q.last){ q.streak=1; }
  else{
    var d=gap(t,q.last);
    if(d===1) q.streak++;
    else if(d===2 && q.grace>0){ q.grace--; q.streak++; }
    else q.streak=1;
  }
  q.last=t; state.lit++; state.days[t]=(state.days[t]||0)+1; state.taught=true;

  if(q.streak>=GOAL){ purify(q); return; }
  undoData=before;
  clearTimeout(undoTimer);
  undoTimer=setTimeout(function(){ undoData=null; renderLines(); }, 9000);
  save(); renderLines(id); renderDash(); whisper("よし");
}

/* 灯した分を、そのまま返す。 */
function unkindle(id){
  var q=find(id||(undoData&&undoData.id)), t=key();
  if(!q || q.last!==t) return;
  var back = (undoData && undoData.id===q.id) ? undoData : null;
  q.last = back ? back.last : null;
  q.streak = back ? back.streak : Math.max(0,q.streak-1);
  if(back) q.grace = back.grace;
  state.lit=Math.max(0,state.lit-1);
  state.days[t]=Math.max(0,(state.days[t]||1)-1);
  if(!state.days[t]) delete state.days[t];
  undoData=null; clearTimeout(undoTimer);
  save(); renderLines(); renderDash();
}

function purify(q){
  state.quests=state.quests.filter(function(x){ return x.id!==q.id; });
  state.archive.push({title:q.title||q.action, action:q.action, anchor:q.anchor, done:key()});
  undoData=null;
  if(state.queue.length) state.quests.push(state.queue.shift());   /* 空いた枠に、待ちの先頭 */
  save(); renderLines(); renderQueue(); renderDash();
  var r=document.getElementById("rite");
  document.getElementById("riteText").textContent=q.action;
  r.classList.add("on");
  setTimeout(function(){ r.classList.remove("on"); }, 2300);
}

function whisper(text){
  var w=document.getElementById("whisper");
  w.textContent=text;
  w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
}

var lines=document.getElementById("lines");
lines.addEventListener("click",function(e){
  var f=e.target.closest("[data-fix]");
  if(f){ openEdit(f.getAttribute("data-fix")); return; }
  var el=e.target.closest(".line");
  if(el) kindle(el.getAttribute("data-id"));
});
document.getElementById("foot").addEventListener("click",function(e){
  if(e.target.closest("#undoBtn")) unkindle();
});

/* ── 直す ─────────────────────────────── */
var editId=null, dropArmed=false;
var sheet=document.getElementById("sheet"), sheetBg=document.getElementById("sheetBg");
var eWhat=document.getElementById("eWhat"), eWhen=document.getElementById("eWhen");
var eDrop=document.getElementById("eDrop"), eOut=document.getElementById("eOut");

function openEdit(id){
  var q=find(id); if(!q) return;
  editId=id; dropArmed=false;
  eDrop.textContent="let go";
  eWhat.value=q.action||""; eWhen.value=q.anchor||"";
  eOut.hidden = q.last!==key();
  sheetBg.classList.add("on"); sheet.classList.add("on");
}
function closeEdit(){
  sheetBg.classList.remove("on"); sheet.classList.remove("on");
  editId=null; dropArmed=false;
}
sheetBg.addEventListener("click",closeEdit);
document.getElementById("eSave").addEventListener("click",function(){
  var q=find(editId);
  if(q){
    var t=eWhat.value.trim();
    if(t){ q.action=t; q.title=t; }
    q.anchor=eWhen.value.trim();
    save(); renderLines();
  }
  closeEdit();
});
eDrop.addEventListener("click",function(){
  if(!dropArmed){ dropArmed=true; eDrop.textContent="sure?"; return; }
  var id=editId;
  state.quests=state.quests.filter(function(x){ return x.id!==id; });
  save(); renderLines(); renderQueue(); renderEntry();
  closeEdit();
});
eOut.addEventListener("click",function(){ unkindle(editId); closeEdit(); });
[eWhat,eWhen].forEach(function(el){
  el.addEventListener("keydown",function(e){
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==="Enter"){ e.preventDefault(); document.getElementById("eSave").click(); }
  });
});

/* ── 記入 ─────────────────────────────── */
var actIn=document.getElementById("actIn"), ancIn=document.getElementById("ancIn");
var keepBtn=document.getElementById("keepBtn");

var orb=document.getElementById("orb"), orbWrap=document.getElementById("orbWrap");
var orbLab=document.getElementById("orbLab"), form=document.getElementById("form");
var wWrite=document.getElementById("wWrite"), wLives=document.getElementById("wLives");
var mode="orb", backTo="orb";   /* orb → form → orb / lives */

function setMode(m){
  if(m==="lives" && mode!=="lives") backTo=mode;   /* 書きかけなら、書きかけへ戻す */
  mode=m;
  wWrite.classList.toggle("off", m==="lives");
  wLives.classList.toggle("off", m!=="lives");
  orbWrap.hidden = (m!=="orb");
  form.hidden = (m!=="form");
  if(m!=="form"){ actIn.blur(); ancIn.blur(); }
  if(m==="form") setTimeout(function(){ actIn.focus(); }, 80);
  if(m==="lives") renderLife();
}
orb.addEventListener("click",function(){ setMode("form"); });
function renderEntry(){
  var over=state.quests.length>=SLOTS;
  orbLab.textContent = over ? "the next one waits" : "tap to write";
  ready();
}
function ready(){
  keepBtn.classList.toggle("ready", actIn.value.trim().length>0 && !actIn.disabled);
}
[actIn,ancIn].forEach(function(el){ el.addEventListener("input",ready); });
actIn.addEventListener("keydown",function(e){
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ancIn.focus(); }
});
ancIn.addEventListener("keydown",function(e){
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==="Enter"){ e.preventDefault(); keep(); }
});
keepBtn.addEventListener("click",keep);

function keep(){
  var a=actIn.value.trim();
  if(!a){ actIn.focus(); return; }
  var q={
    id:"q"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title:a, action:a, anchor:ancIn.value.trim(), cheer:"よし",
    streak:0, last:null, grace:1, born:key()
  };
  /* 三つ埋まっていても捨てない。待ちに置く。 */
  if(state.quests.length<SLOTS) state.quests.push(q); else state.queue.push(q);
  save();
  actIn.value=""; ancIn.value="";
  setMode("orb");
  renderLines(); renderQueue(); renderEntry(); go(1);
}

/* 背景に、すでにある一日を流す */
function drift(){
  var box=document.getElementById("drift"), h="", n=HINTS.length;
  var rows=[[],[],[],[],[],[]];
  HINTS.forEach(function(t,i){ rows[i%6].push(t); });
  var sp=["96s","124s","108s","140s","116s","132s"];
  rows.forEach(function(items,i){
    var row=items.concat(items).map(function(t){ return "<span>"+esc(t)+"</span>"; }).join("");
    h+='<div class="lane" style="--s:'+sp[i]+';margin-top:'+(i?38:70)+'px">'+row+"</div>";
  });
  box.innerHTML=h;
}

/* ── 記録された習慣をめくる ───────────── */
var lifeOrder=[], lifeAt=0;
function shuffleLives(){
  lifeOrder=LIVES.map(function(_,i){ return i; });
  for(var i=lifeOrder.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)), t=lifeOrder[i];
    lifeOrder[i]=lifeOrder[j]; lifeOrder[j]=t;
  }
  lifeAt=0;
}
function renderLife(){
  var L=LIVES[lifeOrder[lifeAt % lifeOrder.length]];
  var c=document.getElementById("lifecard");
  c.innerHTML='<div class="who en">'+esc(L[0])+"</div>"+
    '<div class="what">'+esc(L[1])+"</div>"+
    '<div class="did">'+esc(L[2])+"</div>";
  c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip");
}
function nextLife(){
  lifeAt++;
  if(lifeAt % lifeOrder.length===0) shuffleLives();
  renderLife();
}
/* ── 縦の入れ替え ─────────────────────── */
/* 指の動きをそのまま面に渡す。縦と決まってから捕まえるので、横の面送りと喧嘩しない。
   速く払えば短い距離でも決まる。 */
function swipey(pane, cfg){
  var y=0,x=0,t=0,id=null,on=false,ax="",moved=false,until=0;
  function reset(){ var el=cfg.layer(); if(el) el.style.transform=""; }
  /* 引いた直後に出るクリックだけを飲む。時間で切らないと、
     次の本物のタップまで食べてしまう。 */
  pane.addEventListener("click",function(e){
    if(Date.now()<until){ until=0; e.stopPropagation(); e.preventDefault(); }
  },true);
  pane.addEventListener("pointerdown",function(e){
    if(e.target.closest("input,textarea")) return;
    on=true; ax=""; moved=false;
    y=e.clientY; x=e.clientX; t=Date.now(); id=e.pointerId;
  });
  pane.addEventListener("pointermove",function(e){
    if(!on || (id!==null && e.pointerId!==id)) return;
    var dy=e.clientY-y, dx=e.clientX-x;
    if(!ax && (Math.abs(dy)>5 || Math.abs(dx)>5)){
      if(Math.abs(dy) > Math.abs(dx)*1.1){
        ax = cfg.allow(dy>0?1:-1, e.target) ? "y" : "skip";
        if(ax==="y"){ try{ pane.setPointerCapture(id); }catch(err){} }
      }else ax="x";
    }
    if(ax!=="y") return;
    if(Math.abs(dy)>10) moved=true;
    var el=cfg.layer();
    if(el) el.style.transform="translateY("+(dy*0.32).toFixed(1)+"px)";
  });
  pane.addEventListener("pointerup",function(e){
    if(!on) return; on=false;
    try{ pane.releasePointerCapture(id); }catch(err){}
    reset();
    if(moved) until=Date.now()+350;
    if(ax!=="y") return;
    var dy=((e && e.clientY)||y)-y, dt=Math.max(1,Date.now()-t), v=dy/dt, fling=Math.abs(v)>0.4;
    if(dy>34 || (fling && dy>14)) cfg.down();
    else if(dy<-34 || (fling && dy<-14)) cfg.up();
  });
  pane.addEventListener("pointercancel",function(){ on=false; reset(); });
  pane.addEventListener("wheel",function(e){
    if(Math.abs(e.deltaY)<24) return;
    var dir = e.deltaY<0 ? 1 : -1;
    if(!cfg.allow(dir, e.target)) return;
    e.preventDefault();
    if(dir>0) cfg.down(); else cfg.up();
  },{passive:false});
}
function atTop(el){ return !el || el.scrollTop<=1; }

/* 書く面：下へ引くと記録、上へ払うと戻る。 */
var pane=document.getElementById("pane-new");
swipey(pane,{
  layer:function(){ return mode==="lives" ? wLives : wWrite; },
  allow:function(){ return true; },
  down:function(){ if(mode==="lives") nextLife(); else setMode("lives"); },
  up:function(){ if(mode==="lives") setMode(backTo); }
});

/* 今日の面：上へ払うと待ち、下へ引くと浄めたもの。 */
var paneT=document.getElementById("pane-today");
var tView="today";
var tToday=document.getElementById("tToday"), tQueue=document.getElementById("tQueue"),
    tDone=document.getElementById("tDone");
function tMode(v){
  tView=v;
  tToday.classList.toggle("off", v!=="today");
  tQueue.classList.toggle("off", v!=="queue");
  tDone.classList.toggle("off", v!=="done");
  if(v==="queue") renderQueue();
  if(v==="done") renderDone();
}
paneT.addEventListener("click",function(e){
  if(e.target.closest("[data-back]")) tMode("today");
});
swipey(paneT,{
  layer:function(){ return tView==="queue" ? tQueue : tView==="done" ? tDone : tToday; },
  allow:function(dir, target){
    var list=target && target.closest ? target.closest(".list") : null;
    if(tView==="queue") return dir>0 && atTop(list);      /* 下へ引いて戻る */
    if(tView==="done")  return dir<0 && atTop(list);      /* 上へ払って戻る */
    return true;
  },
  down:function(){ if(tView==="today") tMode("done"); else if(tView==="queue") tMode("today"); },
  up:function(){ if(tView==="today") tMode("queue"); else if(tView==="done") tMode("today"); }
});

/* ── 記録 ─────────────────────────────── */
function renderDash(){
  var d=new Date();
  document.getElementById("dToday").textContent=MON[d.getMonth()]+" "+d.getDate()+", "+WD[d.getDay()];
  document.getElementById("dSub").textContent=key(d);
  document.getElementById("nLit").textContent=state.lit;
  document.getElementById("nPure").textContent=state.archive.length;
  var run=0; state.quests.forEach(function(q){ if(q.streak>run) run=q.streak; });
  document.getElementById("nRun").textContent=run;

  var t=key(), today=toDate(t), h="", i;
  var end=new Date(today); end.setDate(end.getDate() + (6 - end.getDay()));
  var start=new Date(end); start.setDate(start.getDate() - 69);
  for(i=0;i<70;i++){
    var day=new Date(start); day.setDate(day.getDate()+i);
    var k=key(day), n=state.days[k]||0;
    var op=n?Math.min(1,0.46+n*0.27):0;
    h+='<div class="cell'+(k===t?" today":"")+'" title="'+k+'">'+
       (n?'<span class="f" style="opacity:'+op.toFixed(2)+'"></span>':"")+"</div>";
  }
  document.getElementById("grid").innerHTML=h;

  var box=document.getElementById("relics");
  if(!state.archive.length){
    box.innerHTML='<p class="none en">nothing yet.</p>';
  }else{
    var r="";
    state.archive.slice().reverse().forEach(function(a){
      r+='<div class="relic"><span class="d"></span><p>'+esc(a.action)+
         "</p><time>"+esc(a.done)+"</time></div>";
    });
    box.innerHTML=r;
  }
  renderNotes();
}

function renderNotes(){
  var box=document.getElementById("noteList");
  if(!state.notes.length){ box.innerHTML='<p class="none en" style="margin-top:14px">nothing yet.</p>'; return; }
  var h="";
  state.notes.slice().reverse().forEach(function(n,i){
    var idx=state.notes.length-1-i;
    h+='<div class="note"><time>'+esc(String(n.at||"").slice(5))+"</time>"+
       "<p>"+esc(n.t)+'</p><button data-note="'+idx+'" aria-label="remove">×</button></div>';
  });
  box.innerHTML=h;
}
document.getElementById("noteAdd").addEventListener("click",function(){
  var el=document.getElementById("noteIn"), t=el.value.trim();
  if(!t) return;
  state.notes.push({t:t, at:key()});
  save(); el.value=""; el.blur(); renderNotes();
});
document.getElementById("noteList").addEventListener("click",function(e){
  var b=e.target.closest("[data-note]");
  if(!b) return;
  state.notes.splice(+b.getAttribute("data-note"),1);
  save(); renderNotes();
});

document.getElementById("ioOut").addEventListener("click",function(){
  var b=document.getElementById("ioBox");
  b.value=JSON.stringify(state); b.focus(); b.select();
  document.getElementById("ioNote").textContent="hold it somewhere, paste it there.";
});
document.getElementById("ioIn").addEventListener("click",function(){
  var b=document.getElementById("ioBox"), t=b.value.trim();
  if(!t) return;
  try{
    var o=JSON.parse(t);
    if(!o || !Array.isArray(o.quests)) throw 0;
    o.archive=o.archive||[]; o.lit=o.lit||0; o.days=o.days||{}; o.notes=o.notes||[];
    state=o; save(); renderLines(); renderDash(); renderEntry(); renderQueue(); renderDone();
    b.value=""; document.getElementById("ioNote").textContent="here they are.";
  }catch(e){
    document.getElementById("ioNote").textContent="that did not read. check it.";
  }
});

/* ── 三面の行き来 ─────────────────────── */
var pager=document.getElementById("pager");
var dotBtns=document.getElementById("dots").children;
var touched=false, tween=null, guard=null, dur=300;
function land(to){
  if(tween){ cancelAnimationFrame(tween); tween=null; }
  pager.scrollLeft=to;
  pager.style.scrollSnapType="";
}
function go(i){
  touched=true;
  var from=pager.scrollLeft, to=i*pager.clientWidth;
  setDots(i);
  if(Math.abs(to-from)<1) return;
  if(tween) cancelAnimationFrame(tween);
  clearTimeout(guard);
  pager.style.scrollSnapType="none";
  var t0=null;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var e=k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    pager.scrollLeft=from+(to-from)*e;
    if(k<1) tween=requestAnimationFrame(step);
    else land(to);
  }
  tween=requestAnimationFrame(step);
  guard=setTimeout(function(){ land(to); }, dur+220);
}
function setDots(i){ for(var n=0;n<3;n++) dotBtns[n].classList.toggle("on", n===i); }
for(var di=0; di<dotBtns.length; di++){
  dotBtns[di].addEventListener("click",function(e){
    go(+e.currentTarget.getAttribute("data-go"));
  });
}
document.addEventListener("keydown",function(e){
  if(sheet.classList.contains("on")) return;
  if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  var i=Math.round(pager.scrollLeft/pager.clientWidth);
  if(e.key==="ArrowLeft" && i>0) go(i-1);
  if(e.key==="ArrowRight" && i<2) go(i+1);
});
var st=null;
pager.addEventListener("scroll",function(){
  clearTimeout(st);
  st=setTimeout(function(){ setDots(Math.round(pager.scrollLeft/pager.clientWidth)); },70);
});
window.addEventListener("resize",function(){
  var i=Math.round(pager.scrollLeft/pager.clientWidth);
  pager.scrollLeft=i*pager.clientWidth;
});

/* ── 黒い紙の繊維 ─────────────────────── */
function washi(){
  try{
    var c=document.createElement("canvas"), S=512;
    c.width=c.height=S;
    var g=c.getContext("2d"); if(!g) return;
    var col=getComputedStyle(document.documentElement).getPropertyValue("--fiber").trim();
    g.strokeStyle=col||"rgba(226,214,186,.028)"; g.lineCap="round";
    for(var i=0;i<230;i++){
      var x=Math.random()*S, y=Math.random()*S,
          a=Math.random()*Math.PI*2, len=4+Math.random()*34;
      g.lineWidth=0.3+Math.random()*0.5;
      g.beginPath(); g.moveTo(x,y);
      g.quadraticCurveTo(x+Math.cos(a)*len*0.5+(Math.random()-0.5)*5,
                         y+Math.sin(a)*len*0.5+(Math.random()-0.5)*5,
                         x+Math.cos(a)*len, y+Math.sin(a)*len);
      g.stroke();
    }
    document.body.style.backgroundImage="url("+c.toDataURL("image/png")+")";
    document.body.style.backgroundRepeat="repeat";
  }catch(e){}
}

/* ── 起動 ─────────────────────────────── */
renderLines(); renderDash(); renderEntry(); renderQueue(); renderDone(); drift(); washi();
shuffleLives(); renderLife();

function center(){
  if(touched || !pager.clientWidth) return;
  pager.scrollLeft=pager.clientWidth;
  setDots(1);
}
["pointerdown","touchstart","wheel","keydown"].forEach(function(ev){
  window.addEventListener(ev,function(){ touched=true; },{passive:true});
});
center();
requestAnimationFrame(center);
window.addEventListener("load",center);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(center).catch(function(){});
[60,200,500,900].forEach(function(ms){ setTimeout(center, ms); });

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
