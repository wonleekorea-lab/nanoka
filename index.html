<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七日の灯</title>
<meta name="description" content="1分の行動を7日ともし切って、習慣として浄化していく。">
<meta name="theme-color" content="#EFEDE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="七日の灯">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ── 昼の和紙 ───────────────────────────────────────── */
:root{
  --paper:#EFEDE5;
  --sheet:#F7F6F1;
  --edge:#DCD7C9;
  --rule:#CBC5B4;
  --sumi:#22201B;
  --sumi2:#6C675B;
  --sumi3:#A69F8E;
  --lit:#8A5410;
  --bloom:rgba(232,166,64,.20);
  --bloom-soft:rgba(232,166,64,.13);
  --bloom-cell:rgba(226,155,48,.78);
  --fiber:rgba(120,108,84,.055);
  --body:"Zen Kaku Gothic New",'Hiragino Sans',system-ui,sans-serif;
}
/* ── 夜の和紙（灯を後ろから受けた紙）───────────────── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14120E;
    --sheet:#1D1A15;
    --edge:#2C2820;
    --rule:#3A342B;
    --sumi:#EFE9DB;
    --sumi2:#9B9483;
    --sumi3:#6A6454;
    --lit:#F3C57C;
    --bloom:rgba(240,186,104,.30);
    --bloom-soft:rgba(240,186,104,.10);
    --bloom-cell:rgba(240,186,104,.62);
    --fiber:rgba(228,214,186,.032);
  }
}
:root[data-theme="dark"]{
  --paper:#14120E; --sheet:#1D1A15; --edge:#2C2820; --rule:#3A342B;
  --sumi:#EFE9DB; --sumi2:#9B9483; --sumi3:#6A6454; --lit:#F3C57C;
  --bloom:rgba(240,186,104,.30); --bloom-soft:rgba(240,186,104,.10);
  --bloom-cell:rgba(240,186,104,.62);
  --fiber:rgba(228,214,186,.032);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--sumi);
  font-family:var(--body); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--lit);outline-offset:4px;border-radius:2px}

/* ── 三面 ────────────────────────────────────────────── */
.pager{
  display:flex; height:100dvh; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.pane{
  flex:0 0 100%; min-width:100%; height:100dvh; scroll-snap-align:center;
  display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.mid{justify-content:center; padding:0 26px}
.mid > *{max-width:420px; width:100%; margin:0 auto}

/* ── 今日の三行 ──────────────────────────────────────── */
.lines{display:flex;flex-direction:column;gap:30px}
.line{position:relative;display:block;width:100%;text-align:left;padding:8px 0 0}
.line .glow{
  position:absolute; left:-40px; right:-40px; top:-34px; bottom:-16px; pointer-events:none;
  background:radial-gradient(52% 58% at 50% 52%, var(--bloom), transparent 78%);
  opacity:0; transition:opacity 1.1s ease;
}
.line.on .glow{opacity:1}
.line .txt{
  position:relative; display:block; font-size:19px; font-weight:500; line-height:1.55;
  letter-spacing:.005em; color:var(--sumi); transition:color .7s ease; text-wrap:pretty;
}
.line.on .txt{color:var(--lit)}
.when{color:var(--sumi3);font-size:13px;margin-left:.7em;font-weight:400}
.line.on .when{color:var(--sumi2)}
.wick{position:relative;display:flex;gap:5px;margin-top:14px}
.wick i{flex:1;height:2px;border-radius:1px;background:var(--rule);
  transition:background .6s ease, box-shadow .6s ease}
.wick i.f{background:var(--lit);box-shadow:0 0 9px var(--bloom)}
.wick i.now{animation:kindle 1s ease both}
@keyframes kindle{0%{transform:scaleX(0);opacity:0}60%{transform:scaleX(1.02)}100%{transform:none;opacity:1}}
.blank{height:2px;background:var(--rule);opacity:.42;margin:30px 0 0}

.nudge{
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  color:var(--sumi3); font-size:26px; line-height:1; animation:sway 2.6s ease-in-out infinite;
}
@keyframes sway{0%,100%{transform:translate(0,-50%);opacity:.35}50%{transform:translate(6px,-50%);opacity:.8}}
.tip{margin-top:38px;color:var(--sumi3);font-size:12.5px;letter-spacing:.14em;text-align:center}

/* ── 登録 ────────────────────────────────────────────── */
#seed{
  width:100%; background:transparent; border:0; border-bottom:2px solid var(--rule);
  color:var(--sumi); font-family:var(--body); font-size:20px; line-height:1.55;
  padding:6px 0 12px; resize:none;
}
#seed::placeholder{color:var(--sumi3)}
#seed:focus{outline:none;border-bottom-color:var(--lit)}
#seed:disabled{opacity:.45}
.cands{margin-top:26px;display:flex;flex-direction:column}
.cand{
  display:block;width:100%;text-align:left;font-size:16px;color:var(--sumi2);
  padding:13px 0;border-bottom:1px solid var(--edge);line-height:1.5;
}
.cand:first-child{border-top:1px solid var(--edge)}
.cand:hover{color:var(--lit)}
.wait{margin-top:26px;display:flex;align-items:center;gap:9px;color:var(--sumi3);font-size:13px}
.wait i{width:6px;height:6px;border-radius:50%;background:var(--lit);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.say{margin-top:22px;color:var(--sumi3);font-size:12.5px;letter-spacing:.1em}

/* ── 記録 ────────────────────────────────────────────── */
#pane-dash{padding:0 24px}
#pane-dash > .in{max-width:420px;width:100%;margin:0 auto;
  padding-top:calc(34px + env(safe-area-inset-top)); padding-bottom:120px}
.today{font-size:17px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--sumi3);font-size:11.5px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.nums{display:flex;gap:26px;margin-top:20px}
.nums div{line-height:1.2}
.nums b{display:block;font-size:22px;font-weight:700;color:var(--lit);font-variant-numeric:tabular-nums}
.nums span{font-size:11px;color:var(--sumi3);letter-spacing:.08em}
.mark{
  margin:34px 0 12px;color:var(--sumi3);font-size:11px;letter-spacing:.18em;
  display:flex;align-items:center;gap:10px;
}
.mark::after{content:"";flex:1;height:1px;background:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;border-radius:2px;background:var(--sheet);border:1px solid var(--edge)}
.cell .f{position:absolute;inset:-2px;border-radius:3px;
  background:radial-gradient(62% 62% at 50% 50%, var(--bloom-cell), transparent 76%)}
.cell.today{border-color:var(--sumi3)}
.relic{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--edge)}
.relic .d{width:7px;height:7px;border-radius:50%;background:var(--lit);
  box-shadow:0 0 8px var(--bloom);flex:none;transform:translateY(-1px)}
.relic p{margin:0;font-size:15px;line-height:1.5}
.relic time{margin-left:auto;color:var(--sumi3);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.none{color:var(--sumi3);font-size:13px;line-height:1.9}

.set label{display:block;color:var(--sumi3);font-size:11px;letter-spacing:.12em;margin-bottom:7px}
.set input,.set textarea{
  width:100%;background:var(--sheet);border:1px solid var(--edge);border-radius:2px;
  color:var(--sumi);font-family:var(--body);font-size:14px;padding:10px 11px;resize:none;
}
.set input:focus,.set textarea:focus{outline:none;border-color:var(--lit)}
.set .b{margin-top:10px;display:flex;gap:8px}
.set .b button{
  flex:1;border:1px solid var(--edge);border-radius:2px;padding:10px;
  font-size:13px;color:var(--sumi2);letter-spacing:.06em;
}
.set .b button:hover{border-color:var(--lit);color:var(--lit)}
.set p{margin:10px 0 0;color:var(--sumi3);font-size:11.5px;line-height:1.75}
.set .box{margin-top:14px}

/* ── 位置 ────────────────────────────────────────────── */
.dots{
  position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:9px;pointer-events:none;z-index:5;
}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);transition:background .3s,transform .3s}
.dots i.on{background:var(--lit);transform:scale(1.25)}

/* ── 演出 ────────────────────────────────────────────── */
#whisper{
  position:fixed;left:0;right:0;top:42%;z-index:40;pointer-events:none;text-align:center;
  font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--lit);opacity:0;
}
#whisper.go{animation:whisper 2.2s ease both}
@keyframes whisper{
  0%{opacity:0;transform:translateY(8px)} 20%{opacity:1;transform:none}
  62%{opacity:1;transform:none} 100%{opacity:0;transform:translateY(-6px)}
}
#rite{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:0 34px;background:var(--paper);
}
#rite.on{display:flex;animation:ritein .5s ease both}
@keyframes ritein{from{opacity:0}to{opacity:1}}
#rite .up{
  position:relative;text-align:center;font-size:21px;font-weight:500;color:var(--lit);
  animation:rise 2.2s cubic-bezier(.3,.7,.3,1) both;
}
#rite .up::before{
  content:"";position:absolute;left:-60px;right:-60px;top:-70px;bottom:-70px;
  background:radial-gradient(50% 50% at 50% 50%, var(--bloom), transparent 70%);
}
@keyframes rise{
  0%{opacity:0;transform:translateY(16px)}
  22%{opacity:1;transform:none} 66%{opacity:1;transform:translateY(-8px)}
  100%{opacity:0;transform:translateY(-42px)}
}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.34);display:none}
.sheet-bg.on{display:block;animation:ritein .2s ease both}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:452px;margin:0 auto;display:none;
  background:var(--sheet);border-top:1px solid var(--edge);border-radius:10px 10px 0 0;
  padding:22px 24px calc(26px + env(safe-area-inset-bottom));
}
.sheet.on{display:block;animation:up .24s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet p{margin:0 0 18px;font-size:16px;line-height:1.5}
.sheet .b{display:flex;gap:10px}
.sheet .b button{flex:1;border:1px solid var(--edge);border-radius:2px;padding:12px;
  font-size:14px;letter-spacing:.1em;color:var(--sumi2)}
.sheet .b button.go{border-color:var(--lit);color:var(--lit)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="pager" id="pager">

  <!-- 登録 -->
  <section class="pane mid" id="pane-new">
    <div>
      <textarea id="seed" rows="2" placeholder="身につけたいこと" autocomplete="off"></textarea>
      <div id="after"></div>
    </div>
  </section>

  <!-- 今日 -->
  <section class="pane mid" id="pane-today">
    <div style="position:relative">
      <div class="lines" id="lines"></div>
      <div id="hint"></div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="pane" id="pane-dash">
    <div class="in">
      <div class="today" id="dToday">—</div>
      <div class="sub" id="dSub">—</div>
      <div class="nums">
        <div><b id="nLit">0</b><span>灯</span></div>
        <div><b id="nPure">0</b><span>浄</span></div>
        <div><b id="nRun">0</b><span>連</span></div>
      </div>

      <div class="mark">日々</div>
      <div class="grid" id="grid"></div>

      <div class="mark">浄めたもの</div>
      <div id="relics"></div>

      <div class="mark">設定</div>
      <div class="set">
        <label for="keyIn">ANTHROPIC APIキー</label>
        <input type="password" id="keyIn" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
        <div class="b"><button id="keySave">保存</button></div>
        <p id="keyNote"></p>
        <div class="box">
          <label for="ioBox">記録の持ち運び</label>
          <textarea id="ioBox" rows="3"></textarea>
          <div class="b">
            <button id="ioOut">書き出す</button>
            <button id="ioIn">読み込む</button>
          </div>
          <p id="ioNote">端末を移すときに使います。</p>
        </div>
      </div>
    </div>
  </section>

</div>

<nav class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></nav>
<div id="whisper"></div>
<div id="rite"><div class="up" id="riteText"></div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <p id="sheetText">—</p>
  <div class="b">
    <button id="sheetNo">もどる</button>
    <button id="sheetYes" class="go">やめる</button>
  </div>
</div>

<script>
(function(){
"use strict";

var KEY="nanoka.v1", KEYK="nanoka.key", GOAL=7, SLOTS=3;

/* claude.ai版で灯していた記録。この端末で初めて開いたときだけ引き継ぐ。 */
var MIGRATE={"v":1,"updatedAt":1788779985308,"quests":[{"id":"qmtr5exjyl84","title":"発声習慣",
  "action":"「あー」と3秒発声する","anchor":"朝歯磨きをしたら","cheer":"よし","streak":1,
  "last":"2026-09-07","grace":1,"born":"2026-09-07"}],"archive":[],"lit":1,
  "days":{"2026-09-07":1}};

/* ── 状態 ─────────────────────────────── */
function blank(){ return {v:1,updatedAt:0,quests:[],archive:[],lit:0,days:{},taught:false}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw===null){ localStorage.setItem(KEY, JSON.stringify(MIGRATE)); raw=JSON.stringify(MIGRATE); }
    var s=JSON.parse(raw);
    if(!s || !Array.isArray(s.quests)) return blank();
    s.archive=s.archive||[]; s.lit=s.lit||0; s.updatedAt=s.updatedAt||0; s.taught=!!s.taught;
    if(!s.days){                       /* 日ごとの記録は後から足した。既存分を拾い直す。 */
      s.days={};
      s.quests.forEach(function(q){ if(q.last) s.days[q.last]=(s.days[q.last]||0)+1; });
    }
    return s;
  }catch(e){ return blank(); }
}
var state=load();
function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function apiKey(){ try{ return localStorage.getItem(KEYK)||""; }catch(e){ return ""; } }

/* ── 日付 ─────────────────────────────── */
function key(d){
  d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function toDate(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function gap(a,b){ return Math.round((toDate(a)-toDate(b))/86400000); }
var WD=["日","月","火","水","木","金","土"];
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ── 今日の三行 ───────────────────────── */
function lineHtml(q, justNow){
  var on=q.last===key(), w="";
  for(var i=0;i<GOAL;i++){
    var c=i<q.streak?"f":"";
    if(justNow && i===q.streak-1) c+=" now";
    w+='<i class="'+c+'"></i>';
  }
  return '<button class="line'+(on?" on":"")+'" data-id="'+q.id+'" aria-pressed="'+on+'">'+
    '<span class="glow"></span>'+
    '<span class="txt">'+esc(q.action)+
      (q.anchor?'<span class="when">'+esc(q.anchor)+"</span>":"")+"</span>"+
    '<span class="wick">'+w+"</span></button>";
}
function renderLines(justNowId){
  var h="";
  state.quests.forEach(function(q){ h+=lineHtml(q, q.id===justNowId); });
  for(var i=state.quests.length;i<SLOTS;i++) h+='<div class="blank"></div>';
  document.getElementById("lines").innerHTML=h;

  var hint=document.getElementById("hint");
  if(!state.quests.length) hint.innerHTML='<div class="nudge">›</div>';
  else if(!state.taught) hint.innerHTML='<div class="tip">ふれると灯る</div>';
  else hint.innerHTML="";
}

/* ── 灯す ─────────────────────────────── */
function kindle(id){
  var q=null, t=key();
  state.quests.forEach(function(x){ if(x.id===id) q=x; });
  if(!q || q.last===t) return;

  if(!q.last){ q.streak=1; }
  else{
    var d=gap(t,q.last);
    if(d===1) q.streak++;
    else if(d===2 && q.grace>0){ q.grace--; q.streak++; }
    else q.streak=1;
  }
  q.last=t; state.lit++; state.days[t]=(state.days[t]||0)+1; state.taught=true;

  if(q.streak>=GOAL){ purify(q); return; }
  save(); renderLines(id); renderDash(); whisper(q.cheer||"よし");
}

function purify(q){
  state.quests=state.quests.filter(function(x){ return x.id!==q.id; });
  state.archive.push({title:q.title||q.action, action:q.action, anchor:q.anchor, done:key()});
  save(); renderLines(); renderDash(); renderNew();
  var r=document.getElementById("rite");
  document.getElementById("riteText").textContent=q.action;
  r.classList.add("on");
  setTimeout(function(){ r.classList.remove("on"); }, 2300);
}

function whisper(text){
  var w=document.getElementById("whisper");
  w.textContent=text;
  w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
}

/* 長押しでやめる。短いタップと取り違えないよう 520ms。 */
var press=null, pressed=false, dropId=null;
var lines=document.getElementById("lines");
lines.addEventListener("pointerdown",function(e){
  var el=e.target.closest(".line"); if(!el) return;
  pressed=false;
  press=setTimeout(function(){ pressed=true; askDrop(el.getAttribute("data-id")); }, 520);
});
["pointerup","pointercancel","pointerleave"].forEach(function(ev){
  lines.addEventListener(ev,function(){ clearTimeout(press); });
});
lines.addEventListener("click",function(e){
  var el=e.target.closest(".line"); if(!el) return;
  if(pressed){ pressed=false; return; }
  kindle(el.getAttribute("data-id"));
});

function askDrop(id){
  var q=null; state.quests.forEach(function(x){ if(x.id===id) q=x; });
  if(!q) return;
  dropId=id;
  document.getElementById("sheetText").textContent=q.action;
  document.getElementById("sheetBg").classList.add("on");
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){
  document.getElementById("sheetBg").classList.remove("on");
  document.getElementById("sheet").classList.remove("on");
  dropId=null;
}
document.getElementById("sheetNo").addEventListener("click",closeSheet);
document.getElementById("sheetBg").addEventListener("click",closeSheet);
document.getElementById("sheetYes").addEventListener("click",function(){
  if(dropId){
    state.quests=state.quests.filter(function(x){ return x.id!==dropId; });
    save(); renderLines(); renderNew();
  }
  closeSheet();
});

/* ── 登録 ─────────────────────────────── */
var seed=document.getElementById("seed"), after=document.getElementById("after");
var lastQuest=null;

function renderNew(){
  var full=state.quests.length>=SLOTS;
  seed.disabled=full;
  seed.placeholder = full ? "いまは三つまで" : "身につけたいこと";
  if(full){ after.innerHTML=""; lastQuest=null; }
}

function startQuest(text){
  if(state.quests.length>=SLOTS) return null;
  var q={ id:"q"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title:text, action:text, anchor:"", cheer:"よし",
    streak:0, last:null, grace:1, born:key() };
  state.quests.push(q); save(); renderLines(); renderNew();
  return q;
}

seed.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); commit(); }
});
seed.addEventListener("blur",function(){ if(seed.value.trim().length>=2) commit(); });

function commit(){
  var t=seed.value.trim();
  if(!t || state.quests.length>=SLOTS) return;
  var q=startQuest(t);
  if(!q) return;
  lastQuest=q;
  seed.value=""; seed.blur();
  after.innerHTML='<div class="say">置いた</div>';
  go(1);
  if(apiKey()) suggest(q, t);
}

/* 鍵があるときだけ、あとから1分の形に言い直す案を並べる。無視してよい。 */
function suggest(q, text){
  after.innerHTML='<div class="wait"><i></i><span>1分に割っています</span></div>';
  callClaude(promptFor(text)).then(function(d){
    var acts=(d && d.actions || []).slice(0,3).map(function(a){
      return typeof a==="string" ? {text:a,when:""}
           : {text:String(a.text||""), when:String(a.anchor||a.note||"")};
    }).filter(function(a){ return a.text; });
    if(!acts.length){ after.innerHTML=""; return; }
    var h='<div class="cands">';
    acts.forEach(function(a,i){
      h+='<button class="cand" data-i="'+i+'">'+esc(a.text)+
         (a.when?'<span class="when"> '+esc(a.when)+"</span>":"")+"</button>";
    });
    h+='</div><div class="say">ふれると置きかわる</div>';
    after.innerHTML=h;
    after.querySelectorAll(".cand").forEach(function(el){
      el.addEventListener("click",function(){
        var a=acts[+el.getAttribute("data-i")];
        var live=null; state.quests.forEach(function(x){ if(x.id===q.id) live=x; });
        if(live){ live.action=a.text; live.anchor=a.when; live.title=a.text; save(); renderLines(); }
        after.innerHTML='<div class="say">置きかえた</div>';
        go(1);
      });
    });
  }).catch(function(){ after.innerHTML=""; });
}

var PROMPT=
"あなたは習慣設計のコーチです。続かないのは意志ではなく設計の問題だと知っています。\n"+
"ユーザーが身につけたいことを、1分以内で必ず終わる最小行動に割ってください。\n"+
"準備・道具・場所の移動が要らないこと。「5分」「10回」など1分を超える提案は禁止。\n"+
"それぞれに、すでに毎日やっている行動への接続点（その直後に差し込める具体的な場面）を付けてください。\n"+
"誇張・励まし口調・絵文字は禁止。淡々と書くこと。\n\n";
function promptFor(t){
  return PROMPT+"ユーザーが身につけたいこと: 「"+t+"」\n\n"+
  "次の形のJSONだけを返してください（説明文は不要）:\n"+
  '{"actions":[{"text":"1分で終わる具体的な行動。18文字以内","anchor":"すでにやっている行動。12文字以内、「〜したら」「〜の前に」の形"}]}\n'+
  "actionsは3つ。すべて日本語。";
}

function callClaude(prompt){
  var k=apiKey();
  if(!k) return Promise.reject({code:"no_key"});
  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":k,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:"claude-opus-5",
      max_tokens:4000,
      output_config:{effort:"low"},
      messages:[{role:"user",content:prompt}]
    })
  }).then(function(r){
    if(!r.ok) return Promise.reject({code:r.status===401||r.status===403?"auth":"http"});
    return r.json();
  },function(){ return Promise.reject({code:"network"}); })
  .then(function(res){
    if(res && res.stop_reason==="refusal") return Promise.reject({code:"refusal"});
    var text=(res.content||[]).filter(function(b){ return b.type==="text"; })
      .map(function(b){ return b.text||""; }).join("");
    var m=text.match(/```(?:json)?\s*([\s\S]*?)```/), body=m?m[1]:text;
    var a=body.indexOf("{"), b=body.lastIndexOf("}");
    if(a<0||b<=a) throw {code:"invalid_json"};
    return JSON.parse(body.slice(a,b+1));
  });
}

/* ── 記録 ─────────────────────────────── */
function renderDash(){
  var d=new Date();
  document.getElementById("dToday").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）";
  document.getElementById("dSub").textContent=key(d);
  document.getElementById("nLit").textContent=state.lit;
  document.getElementById("nPure").textContent=state.archive.length;
  var run=0; state.quests.forEach(function(q){ if(q.streak>run) run=q.streak; });
  document.getElementById("nRun").textContent=run;

  /* 直近10週。今日が右下に来るよう、週の頭で切り上げる。 */
  var t=key(), today=toDate(t), h="", i;
  var end=new Date(today); end.setDate(end.getDate() + (6 - end.getDay()));
  var start=new Date(end); start.setDate(start.getDate() - 69);
  for(i=0;i<70;i++){
    var day=new Date(start); day.setDate(day.getDate()+i);
    var k=key(day), n=state.days[k]||0;
    var op=n?Math.min(1,0.46+n*0.27):0;
    h+='<div class="cell'+(k===t?" today":"")+'" title="'+k+'">'+
       (n?'<span class="f" style="opacity:'+op.toFixed(2)+'"></span>':"")+"</div>";
  }
  document.getElementById("grid").innerHTML=h;

  var box=document.getElementById("relics");
  if(!state.archive.length){
    box.innerHTML='<p class="none">七日ともし切ったものが、ここに移る。</p>';
  }else{
    var r="";
    state.archive.slice().reverse().forEach(function(a){
      r+='<div class="relic"><span class="d"></span><p>'+esc(a.action)+
         "</p><time>"+esc(a.done)+"</time></div>";
    });
    box.innerHTML=r;
  }
}

/* ── 三面の行き来 ─────────────────────── */
var pager=document.getElementById("pager"), dots=document.getElementById("dots").children;
function go(i){ pager.scrollTo({left:i*pager.clientWidth, behavior:"smooth"}); }
function setDots(i){ for(var n=0;n<3;n++) dots[n].classList.toggle("on", n===i); }
var st=null;
pager.addEventListener("scroll",function(){
  clearTimeout(st);
  st=setTimeout(function(){
    var i=Math.round(pager.scrollLeft/pager.clientWidth);
    setDots(i);
  },80);
});
window.addEventListener("resize",function(){
  var i=Math.round(pager.scrollLeft/pager.clientWidth);
  pager.scrollLeft=i*pager.clientWidth;
});

/* ── 和紙の繊維 ───────────────────────── */
function washi(){
  try{
    var c=document.createElement("canvas"), S=512;
    c.width=c.height=S;
    var g=c.getContext("2d"); if(!g) return;
    var col=getComputedStyle(document.documentElement).getPropertyValue("--fiber").trim();
    g.strokeStyle=col||"rgba(120,108,84,.055)"; g.lineCap="round";
    for(var i=0;i<230;i++){
      var x=Math.random()*S, y=Math.random()*S,
          a=Math.random()*Math.PI*2, len=4+Math.random()*34;
      g.lineWidth=0.3+Math.random()*0.5;
      g.beginPath(); g.moveTo(x,y);
      g.quadraticCurveTo(x+Math.cos(a)*len*0.5+(Math.random()-0.5)*5,
                         y+Math.sin(a)*len*0.5+(Math.random()-0.5)*5,
                         x+Math.cos(a)*len, y+Math.sin(a)*len);
      g.stroke();
    }
    document.body.style.backgroundImage="url("+c.toDataURL("image/png")+")";
    document.body.style.backgroundRepeat="repeat";
  }catch(e){}
}

/* ── 設定 ─────────────────────────────── */
function reflectKey(){
  var has=!!apiKey();
  document.getElementById("keyIn").placeholder = has ? "保存済み" : "sk-ant-…";
  document.getElementById("keyNote").textContent = has
    ? "投げたあと、1分の形に言い直す案が出ます。キーはこの端末にだけ置かれ、送り先はAnthropicのAPIだけです。空にして保存すると消えます。"
    : "空でも使えます。入れると、投げたあとに1分の形へ言い直す案が出ます。";
}
document.getElementById("keySave").addEventListener("click",function(){
  var el=document.getElementById("keyIn"), v=el.value.trim();
  try{ if(v) localStorage.setItem(KEYK,v); else localStorage.removeItem(KEYK); }catch(e){}
  el.value=""; el.blur(); reflectKey();
});
document.getElementById("ioOut").addEventListener("click",function(){
  var b=document.getElementById("ioBox");
  b.value=JSON.stringify(state); b.focus(); b.select();
  document.getElementById("ioNote").textContent="控えて、移す先の同じ欄に貼ってください。";
});
document.getElementById("ioIn").addEventListener("click",function(){
  var b=document.getElementById("ioBox"), t=b.value.trim();
  if(!t) return;
  try{
    var o=JSON.parse(t);
    if(!o || !Array.isArray(o.quests)) throw 0;
    o.archive=o.archive||[]; o.lit=o.lit||0; o.days=o.days||{};
    state=o; save(); renderLines(); renderDash(); renderNew();
    b.value=""; document.getElementById("ioNote").textContent="読み込みました。";
  }catch(e){
    document.getElementById("ioNote").textContent="読み込めませんでした。";
  }
});

/* ── 起動 ─────────────────────────────── */
renderLines(); renderDash(); renderNew(); reflectKey(); washi();
if(window.matchMedia){
  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq,"change") : mq.addListener.bind(mq))(washi);
}
requestAnimationFrame(function(){
  pager.scrollLeft=pager.clientWidth;   /* 中央（今日）から始める */
  setDots(1);
});
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
