<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ember</title>
<meta name="description" content="1分の行動を7日ともし切ると、手をかけなくても燃えている。">
<meta name="theme-color" content="#07080B">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ember">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ── 黒に、光。明暗で切り替えず、この一つの世界に決める。 */
:root{
  --paper:#07080B;
  --sheet:#0E1014;
  --sheet2:#151920;
  --edge:#1E222B;
  --rule:#2B303A;
  --sumi:#EDE8DE;
  --sumi2:#9A9488;
  --sumi3:#5E6470;
  --lit:#FFB24D;
  --hot:#FFE7B8;
  --bloom:rgba(255,166,56,.30);
  --bloom-soft:rgba(255,166,56,.09);
  --bloom-cell:rgba(255,178,77,.72);
  --fiber:rgba(226,214,186,.028);
  --body:"Zen Kaku Gothic New",'Hiragino Sans',system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--sumi);
  font-family:var(--body); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--lit);outline-offset:4px;border-radius:2px}

/* 周辺の言葉は小文字の英語で、小さく置く */
.en{
  font-family:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
  text-transform:lowercase; letter-spacing:.16em; font-weight:400;
}

/* ── 三面 ────────────────────────────────────────────── */
.pager{
  display:flex; height:100dvh; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; overscroll-behavior:contain; scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.pane{
  flex:0 0 100%; min-width:100%; height:100dvh;
  scroll-snap-align:center; scroll-snap-stop:always;
  display:flex; flex-direction:column;
}
/* 横だけの面は縦を持たせない。縦に取られると横スワイプが渋る。 */
#pane-new, #pane-today{overflow:hidden; touch-action:pan-x}
#pane-new.scrolly{
  overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;
  justify-content:flex-start;
  padding-top:calc(30px + env(safe-area-inset-top)); padding-bottom:130px;
}
#pane-dash{overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y}
#seed{touch-action:auto}

.mid{justify-content:center; padding:0 30px}
.mid > .in{max-width:400px; width:100%; margin:0 auto}

/* ── 今日の三行 ──────────────────────────────────────── */
#pane-today .in{
  display:flex; flex-direction:column;
  height:min(74dvh, 620px);
  padding-top:env(safe-area-inset-top);
}
.lines{flex:1; display:flex; flex-direction:column; justify-content:space-evenly}
.line{position:relative;display:block;width:100%;text-align:left;padding:6px 0}
.line .glow{
  position:absolute; left:-44px; right:-44px; top:-40px; bottom:-24px; pointer-events:none;
  background:radial-gradient(52% 58% at 50% 50%, var(--bloom), transparent 78%);
  opacity:0; transition:opacity 1.1s ease;
}
.line.on .glow{opacity:1}
.line.on .txt{text-shadow:0 0 22px var(--bloom)}
.line .txt{
  position:relative; display:block; font-size:21px; font-weight:500; line-height:1.55;
  letter-spacing:.005em; color:var(--sumi); transition:color .7s ease; text-wrap:pretty;
}
.line.on .txt{color:var(--lit)}
.line .when{
  position:relative; display:block; margin-top:7px;
  font-size:12.5px; line-height:1.5; color:var(--sumi3); font-weight:400;
}
.line.on .when{color:var(--sumi2)}
.wick{position:relative;display:flex;gap:6px;margin-top:20px}
.wick i{flex:1;height:2px;border-radius:1px;background:var(--rule);
  transition:background .6s ease, box-shadow .6s ease}
.wick i.f{background:var(--lit);box-shadow:0 0 12px var(--bloom),0 0 3px var(--lit)}
.wick i.now{animation:kindle 1s ease both}
@keyframes kindle{0%{transform:scaleX(0);opacity:0}60%{transform:scaleX(1.02)}100%{transform:none;opacity:1}}
.blank{height:2px;background:var(--rule);opacity:.4}

.foot{height:44px;display:flex;align-items:center;justify-content:center}
.tip{color:var(--sumi3);font-size:11px}
.nudge{
  position:absolute; left:6px; top:50%; transform:translateY(-50%);
  color:var(--sumi3); font-size:30px; line-height:1; animation:sway 2.8s ease-in-out infinite;
}
@keyframes sway{0%,100%{transform:translate(0,-50%);opacity:.3}50%{transform:translate(-7px,-50%);opacity:.75}}

/* ── 登録 ────────────────────────────────────────────── */
#seed{
  width:100%; background:transparent; border:0; border-bottom:2px solid var(--rule);
  color:var(--sumi); font-family:var(--body); font-size:21px; line-height:1.55;
  padding:6px 0 14px; resize:none;
}
#seed::placeholder{color:var(--sumi3);font-size:19px}
#seed:focus{outline:none;border-bottom-color:var(--lit)}
#seed:disabled{opacity:.5}
.cands{margin-top:14px;display:flex;flex-direction:column}
.cand{
  display:block;width:100%;text-align:left;font-size:16.5px;color:var(--sumi2);
  padding:15px 0;border-bottom:1px solid var(--edge);line-height:1.5;
}
.cand:first-child{border-top:1px solid var(--edge)}
.cand small{display:block;margin-top:4px;font-size:12px;color:var(--sumi3)}
.cand:hover{color:var(--lit)}
.wait{margin-top:30px;display:flex;align-items:center;gap:10px;color:var(--sumi3);font-size:11px}
.wait i{width:6px;height:6px;border-radius:50%;background:var(--lit);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.say{margin-top:30px;color:var(--sumi3);font-size:11px}
.thrown{margin-top:26px;color:var(--sumi2);font-size:17px;line-height:1.5}
.field{margin-top:20px}
.cluster{position:relative;margin-bottom:24px}
.cl-glow{
  position:absolute;left:-34px;right:-24px;top:-18px;bottom:-12px;pointer-events:none;
  background:radial-gradient(46% 62% at 26% 50%, var(--bloom-soft), transparent 74%);
}
.cluster.near .cl-glow{background:radial-gradient(46% 62% at 26% 50%, var(--bloom), transparent 74%);opacity:.5}
.cl-name{position:relative;color:var(--sumi3);font-size:10px;margin-bottom:10px}
.cluster.near .cl-name{color:var(--lit);opacity:.75}
.cl-items{position:relative;display:flex;flex-wrap:wrap;gap:7px}
.mchip{
  border:1px solid var(--edge);background:var(--sheet);border-radius:999px;
  padding:9px 14px;font-size:14px;line-height:1.35;color:var(--sumi2);
  transition:color .2s,border-color .2s,background .2s,box-shadow .35s;
}
.cluster.near .mchip{color:var(--sumi)}
.mchip:hover,.mchip:active{
  color:var(--hot);border-color:var(--lit);background:var(--sheet2);
  box-shadow:0 0 22px var(--bloom),0 0 3px var(--bloom-soft);
}
.mchip.own{border-style:dashed;color:var(--sumi3)}
.own{
  display:block;width:100%;margin-top:14px;background:transparent;
  border:0;border-bottom:1px solid var(--edge);color:var(--sumi);
  font-family:var(--body);font-size:18px;padding:5px 0 11px;
}
.own:focus{outline:none;border-bottom-color:var(--lit)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  border:1px solid var(--edge);border-radius:999px;padding:9px 15px;
  font-size:14px;color:var(--sumi2);line-height:1.4;
}
.chip:hover{border-color:var(--lit);color:var(--lit)}

/* ── 記録 ────────────────────────────────────────────── */
#pane-dash{padding:0 28px}
#pane-dash > .in{max-width:400px;width:100%;margin:0 auto;
  padding-top:calc(46px + env(safe-area-inset-top)); padding-bottom:130px}
.today{font-size:19px;font-weight:700;letter-spacing:.01em}
.sub{margin-top:2px;color:var(--sumi3);font-size:10.5px;font-variant-numeric:tabular-nums}
.nums{display:flex;gap:30px;margin-top:30px}
.nums div{line-height:1.25}
.nums b{display:block;font-size:24px;font-weight:700;color:var(--lit);font-variant-numeric:tabular-nums}
.nums span{font-size:10px;color:var(--sumi3)}
.mark{
  margin:46px 0 16px;color:var(--sumi3);font-size:10.5px;
  display:flex;align-items:center;gap:12px;
}
.mark::after{content:"";flex:1;height:1px;background:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1;border-radius:2px;background:var(--sheet);border:1px solid var(--edge)}
.cell .f{position:absolute;inset:-2px;border-radius:3px;
  background:radial-gradient(62% 62% at 50% 50%, var(--bloom-cell), transparent 76%)}
.cell.today{border-color:var(--sumi3)}
.relic{display:flex;gap:14px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--edge)}
.relic .d{width:7px;height:7px;border-radius:50%;background:var(--lit);
  box-shadow:0 0 8px var(--bloom);flex:none;transform:translateY(-1px)}
.relic p{margin:0;font-size:15.5px;line-height:1.5}
.relic time{margin-left:auto;color:var(--sumi3);font-size:10.5px;font-variant-numeric:tabular-nums;flex:none}
.none{color:var(--sumi3);font-size:11px}

.set label{display:block;color:var(--sumi3);font-size:10.5px;margin-bottom:9px}
.set input,.set textarea{
  width:100%;background:var(--sheet);border:1px solid var(--edge);border-radius:2px;
  color:var(--sumi);font-family:var(--body);font-size:14px;padding:11px 12px;resize:none;
}
.set input:focus,.set textarea:focus{outline:none;border-color:var(--lit)}
.set .b{margin-top:12px;display:flex;gap:9px}
.set .b button{
  flex:1;border:1px solid var(--edge);border-radius:2px;padding:11px;
  font-size:11px;color:var(--sumi2);
}
.set .b button:hover{border-color:var(--lit);color:var(--lit)}
.set p{margin:12px 0 0;color:var(--sumi3);font-size:11px;line-height:1.7;letter-spacing:.04em}
.set .box{margin-top:26px}

/* ── 位置（点を押しても移れる）─────────────────────── */
.dots{
  position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;z-index:6;
}
.dots button{padding:14px 11px;line-height:0}
.dots span{display:block;width:6px;height:6px;border-radius:50%;background:var(--rule);
  transition:background .3s, transform .3s}
.dots button.on span{background:var(--lit);transform:scale(1.3)}

/* ── 演出 ────────────────────────────────────────────── */
#whisper{
  position:fixed;left:0;right:0;top:42%;z-index:40;pointer-events:none;text-align:center;
  font-size:30px;font-weight:700;letter-spacing:.16em;color:var(--lit);opacity:0;
}
#whisper.go{animation:whisper 2.2s ease both}
@keyframes whisper{
  0%{opacity:0;transform:translateY(8px)} 20%{opacity:1;transform:none}
  62%{opacity:1;transform:none} 100%{opacity:0;transform:translateY(-6px)}
}
#rite{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:0 34px;background:var(--paper);
}
#rite.on{display:flex;animation:ritein .5s ease both}
@keyframes ritein{from{opacity:0}to{opacity:1}}
#rite .up{
  position:relative;text-align:center;font-size:21px;font-weight:500;color:var(--lit);
  animation:rise 2.2s cubic-bezier(.3,.7,.3,1) both;
}
#rite .up::before{
  content:"";position:absolute;left:-60px;right:-60px;top:-70px;bottom:-70px;
  background:radial-gradient(50% 50% at 50% 50%, var(--bloom), transparent 70%);
}
@keyframes rise{
  0%{opacity:0;transform:translateY(16px)}
  22%{opacity:1;transform:none} 66%{opacity:1;transform:translateY(-8px)}
  100%{opacity:0;transform:translateY(-42px)}
}

/* ── 直す ────────────────────────────────────────────── */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.34);display:none}
.sheet-bg.on{display:block;animation:ritein .2s ease both}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:452px;margin:0 auto;display:none;
  background:var(--sheet);border-top:1px solid var(--edge);border-radius:10px 10px 0 0;
  padding:26px 26px calc(28px + env(safe-area-inset-bottom));
}
.sheet.on{display:block;animation:up .24s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet label{display:block;color:var(--sumi3);font-size:10.5px;margin:0 0 8px}
.sheet .f2{margin-top:20px}
.sheet input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--edge);
  color:var(--sumi);font-family:var(--body);font-size:18px;padding:4px 0 10px;
}
.sheet input.sm{font-size:14px;color:var(--sumi2)}
.sheet input:focus{outline:none;border-bottom-color:var(--lit)}
.sheet .b{display:flex;gap:10px;margin-top:30px}
.sheet .b button{flex:1;border:1px solid var(--edge);border-radius:2px;padding:13px;
  font-size:11px;color:var(--sumi2)}
.sheet .b button.keep{border-color:var(--lit);color:var(--lit)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="pager" id="pager">

  <!-- 登録 -->
  <section class="pane mid" id="pane-new">
    <div class="in">
      <textarea id="seed" rows="2" placeholder="one small thing" autocomplete="off"></textarea>
      <div id="after"></div>
    </div>
  </section>

  <!-- 今日 -->
  <section class="pane mid" id="pane-today">
    <div class="in">
      <div class="lines" id="lines"></div>
      <div class="foot" id="foot"></div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="pane" id="pane-dash">
    <div class="in">
      <div class="today" id="dToday">—</div>
      <div class="sub en" id="dSub">—</div>
      <div class="nums">
        <div><b id="nLit">0</b><span class="en">lit</span></div>
        <div><b id="nPure">0</b><span class="en">released</span></div>
        <div><b id="nRun">0</b><span class="en">in a row</span></div>
      </div>

      <div class="mark en">days</div>
      <div class="grid" id="grid"></div>

      <div class="mark en">released</div>
      <div id="relics"></div>

      <div class="mark en">settings</div>
      <div class="set">
        <label class="en" for="keyIn">api key</label>
        <input type="password" id="keyIn" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
        <div class="b"><button class="en" id="keySave">save</button></div>
        <p class="en" id="keyNote"></p>
        <div class="box">
          <label class="en" for="ioBox">carry over</label>
          <textarea id="ioBox" rows="3"></textarea>
          <div class="b">
            <button class="en" id="ioOut">copy out</button>
            <button class="en" id="ioIn">bring in</button>
          </div>
          <p class="en" id="ioNote">for moving to another phone.</p>
        </div>
      </div>
    </div>
  </section>

</div>

<nav class="dots" id="dots">
  <button data-go="0" aria-label="new"><span></span></button>
  <button data-go="1" aria-label="today"><span></span></button>
  <button data-go="2" aria-label="days"><span></span></button>
</nav>

<div id="whisper"></div>
<div id="rite"><div class="up" id="riteText"></div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <label class="en" for="eWhat">what</label>
  <input type="text" id="eWhat" autocomplete="off">
  <div class="f2">
    <label class="en" for="eWhen">after what</label>
    <input type="text" id="eWhen" class="sm" autocomplete="off" placeholder="—">
    <div class="chips" id="eChips"></div>
  </div>
  <div class="b">
    <button class="en keep" id="eSave">save</button>
    <button class="en" id="eDrop">let go</button>
  </div>
</div>

<script>
(function(){
"use strict";

var KEY="nanoka.v1", KEYK="nanoka.key", GOAL=7, SLOTS=3;

/* claude.ai版で灯していた記録。この端末で初めて開いたときだけ引き継ぐ。 */
var MIGRATE={"v":1,"updatedAt":1788779985308,"quests":[{"id":"qmtr5exjyl84","title":"発声習慣",
  "action":"「あー」と3秒発声する","anchor":"朝歯磨きをしたら","cheer":"よし","streak":1,
  "last":"2026-09-07","grace":1,"born":"2026-09-07"}],"archive":[],"lit":1,
  "days":{"2026-09-07":1}};

/* ── 状態 ─────────────────────────────── */
function blank(){ return {v:1,updatedAt:0,quests:[],archive:[],lit:0,days:{},taught:false}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw===null){ localStorage.setItem(KEY, JSON.stringify(MIGRATE)); raw=JSON.stringify(MIGRATE); }
    var s=JSON.parse(raw);
    if(!s || !Array.isArray(s.quests)) return blank();
    s.archive=s.archive||[]; s.lit=s.lit||0; s.updatedAt=s.updatedAt||0; s.taught=!!s.taught;
    if(!s.days){                       /* 日ごとの記録は後から足した。既存分を拾い直す。 */
      s.days={};
      s.quests.forEach(function(q){ if(q.last) s.days[q.last]=(s.days[q.last]||0)+1; });
    }
    return s;
  }catch(e){ return blank(); }
}
var state=load();
function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function apiKey(){ try{ return localStorage.getItem(KEYK)||""; }catch(e){ return ""; } }
function find(id){ var q=null; state.quests.forEach(function(x){ if(x.id===id) q=x; }); return q; }

/* ── 日付 ─────────────────────────────── */
function key(d){
  d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function toDate(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function gap(a,b){ return Math.round((toDate(a)-toDate(b))/86400000); }
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ── 今日の三行 ───────────────────────── */
function lineHtml(q, justNow){
  var on=q.last===key(), w="";
  for(var i=0;i<GOAL;i++){
    var c=i<q.streak?"f":"";
    if(justNow && i===q.streak-1) c+=" now";
    w+='<i class="'+c+'"></i>';
  }
  return '<button class="line'+(on?" on":"")+'" data-id="'+q.id+'" aria-pressed="'+on+'">'+
    '<span class="glow"></span>'+
    '<span class="txt">'+esc(q.action)+"</span>"+
    (q.anchor?'<span class="when">'+esc(q.anchor)+"</span>":"")+
    '<span class="wick">'+w+"</span></button>";
}
function renderLines(justNowId){
  var h="";
  state.quests.forEach(function(q){ h+=lineHtml(q, q.id===justNowId); });
  for(var i=state.quests.length;i<SLOTS;i++) h+='<div class="blank"></div>';
  document.getElementById("lines").innerHTML=h;

  var foot=document.getElementById("foot");
  if(!state.quests.length) foot.innerHTML='<div class="nudge">&lsaquo;</div>';
  else if(!state.taught) foot.innerHTML='<div class="tip en">touch to light · hold to change</div>';
  else foot.innerHTML="";
}

/* ── 灯す ─────────────────────────────── */
function kindle(id){
  var q=find(id), t=key();
  if(!q || q.last===t) return;

  if(!q.last){ q.streak=1; }
  else{
    var d=gap(t,q.last);
    if(d===1) q.streak++;
    else if(d===2 && q.grace>0){ q.grace--; q.streak++; }
    else q.streak=1;
  }
  q.last=t; state.lit++; state.days[t]=(state.days[t]||0)+1; state.taught=true;

  if(q.streak>=GOAL){ purify(q); return; }
  save(); renderLines(id); renderDash(); whisper(q.cheer||"よし");
}

function purify(q){
  state.quests=state.quests.filter(function(x){ return x.id!==q.id; });
  state.archive.push({title:q.title||q.action, action:q.action, anchor:q.anchor, done:key()});
  save(); renderLines(); renderDash(); renderNew();
  var r=document.getElementById("rite");
  document.getElementById("riteText").textContent=q.action;
  r.classList.add("on");
  setTimeout(function(){ r.classList.remove("on"); }, 2300);
}

function whisper(text){
  var w=document.getElementById("whisper");
  w.textContent=text;
  w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
}

/* ── ふれる／押す ─────────────────────── */
/* 短くふれたら灯る。押し続けると直せる。今日もう灯した行は、ふれれば直しに入る。 */
var press=null, held=false, startY=0, moved=false;
var lines=document.getElementById("lines");
lines.addEventListener("pointerdown",function(e){
  var el=e.target.closest(".line"); if(!el) return;
  held=false; moved=false; startY=e.clientY;
  press=setTimeout(function(){
    held=true;
    if(!moved) openEdit(el.getAttribute("data-id"));
  }, 480);
});
lines.addEventListener("pointermove",function(e){
  if(press===null) return;
  if(Math.abs(e.clientY-startY)>10){ moved=true; clearTimeout(press); press=null; }
});
["pointerup","pointercancel","pointerleave"].forEach(function(ev){
  lines.addEventListener(ev,function(){ clearTimeout(press); press=null; });
});
lines.addEventListener("click",function(e){
  var el=e.target.closest(".line"); if(!el) return;
  if(held){ held=false; return; }
  var id=el.getAttribute("data-id"), q=find(id);
  if(q && q.last===key()) openEdit(id);   /* 今日はもう灯した。押せば直せる。 */
  else kindle(id);
});

/* ── 直す ─────────────────────────────── */
var editId=null, dropArmed=false;
var sheet=document.getElementById("sheet"), sheetBg=document.getElementById("sheetBg");
var eWhat=document.getElementById("eWhat"), eWhen=document.getElementById("eWhen");
var eDrop=document.getElementById("eDrop");

function openEdit(id){
  var q=find(id); if(!q) return;
  editId=id; dropArmed=false;
  eDrop.textContent="let go";
  eWhat.value=q.action||""; eWhen.value=q.anchor||"";
  document.getElementById("eChips").innerHTML=ANCHORS.map(function(a){
    return '<button class="chip" data-c="'+esc(a)+'">'+esc(a)+"</button>";
  }).join("");
  sheetBg.classList.add("on"); sheet.classList.add("on");
  setTimeout(function(){ eWhat.focus(); }, 260);
}
function closeEdit(){
  sheetBg.classList.remove("on"); sheet.classList.remove("on");
  editId=null; dropArmed=false;
}
sheetBg.addEventListener("click",closeEdit);
document.getElementById("eChips").addEventListener("click",function(e){
  var c=e.target.closest("[data-c]");
  if(c) eWhen.value=c.getAttribute("data-c");
});
document.getElementById("eSave").addEventListener("click",function(){
  var q=find(editId);
  if(q){
    var t=eWhat.value.trim();
    if(t){ q.action=t; q.title=t; }
    q.anchor=eWhen.value.trim();
    save(); renderLines();
  }
  closeEdit();
});
eDrop.addEventListener("click",function(){
  if(!dropArmed){ dropArmed=true; eDrop.textContent="sure?"; return; }
  var id=editId;
  state.quests=state.quests.filter(function(x){ return x.id!==id; });
  save(); renderLines(); renderNew();
  closeEdit();
});
[eWhat,eWhen].forEach(function(el){
  el.addEventListener("keydown",function(e){
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==="Enter"){ e.preventDefault(); document.getElementById("eSave").click(); }
  });
});

/* ── 登録 ─────────────────────────────── */
/* すでに毎日やっていること。直すシートの早取り用。 */
var ANCHORS=["歯を磨いたら","顔を洗ったら","コーヒーを淹れたら","席についたら",
             "家に着いたら","靴を脱いだら","風呂から出たら","布団に入ったら"];

/* 一日の細かい瞬間を、場面の塊にして持つ。
   一つずつ繰るのではなく、塊ごと見渡して掴めるように。 */
var CLUSTERS=[
  ["waking","morning",["目が覚めたら","布団から足を出したら","カーテンを開けたら"]],
  ["washing","morning",["トイレを出たら","顔を洗ったら","歯を磨いたら","鏡から目を離したら"]],
  ["kitchen","morning",["コップに水を注いだら","湯が沸いたら","コーヒーを淹れたら",
                        "最初の一口を飲んだら","皿をシンクに置いたら","冷蔵庫を閉めたら"]],
  ["leaving","morning",["薬を飲んだら","着替え終わったら","鞄を持ち上げたら",
                        "靴を履いたら","玄関の鍵を閉めたら"]],
  ["commute","midday",["改札を通ったら","電車に乗ったら","電車を降りたら","エレベーターを待つ間"]],
  ["desk","midday",["席についたら","画面を開く前に","最初のメールを閉じたら","会議が終わったら",
                    "電話を切ったら","立ち上がったとき","画面から目を離したとき"]],
  ["midday","midday",["手を洗ったら","昼を食べ終えたら","コンビニを出たら",
                      "午後の一杯を淹れたら","伸びをしたあと"]],
  ["coming home","evening",["仕事を閉じたら","建物を出たら","帰りの電車に乗ったら",
                            "家の鍵を開けたら","靴を脱いだら","上着をかけたら","うがいをしたら"]],
  ["supper","evening",["夕食の皿を片づけたら","湯を張ったら"]],
  ["bath","night",["風呂から出たら","髪を乾かしたら"]],
  ["bed","night",["夜の歯磨きを終えたら","明日の服を出したら","照明を落としたら",
                  "スマホを充電器に置いたら","布団に入ったら","枕に頭をつけたら"]]
];

var seed=document.getElementById("seed"), after=document.getElementById("after");

function renderNew(){
  var full=state.quests.length>=SLOTS;
  seed.disabled=full;
  seed.placeholder = full ? "three is enough" : "one small thing";
  if(full){
    after.innerHTML=""; flow=null; seed.style.display="";
    document.getElementById("pane-new").classList.remove("scrolly");
  }
}

function startQuest(text){
  if(state.quests.length>=SLOTS) return null;
  var q={ id:"q"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title:text, action:text, anchor:"", cheer:"よし",
    streak:0, last:null, grace:1, born:key() };
  state.quests.push(q); save(); renderLines(); renderNew();
  return q;
}

seed.addEventListener("keydown",function(e){
  if(e.isComposing || e.keyCode===229) return;   /* 変換中の確定Enterは登録ではない */
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); commit(); }
});
seed.addEventListener("blur",function(){ if(seed.value.trim().length>=2) commit(); });

var flow=null;

function commit(){
  var t=seed.value.trim();
  if(!t || state.quests.length>=SLOTS) return;
  var q=startQuest(t);
  if(!q) return;
  seed.value=""; seed.blur();
  /* 投げた時点でもう登録されている。ここから先は足さなくてよい。 */
  flow={id:q.id, phrase:t, actions:[], anchors:[], pool:[]};
  if(apiKey()){
    renderFlow("wait");
    callClaude(promptFor(t)).then(function(d){
      flow.actions=(d && d.actions || []).slice(0,3).map(function(a){
        return typeof a==="string" ? {text:a} : {text:String(a.text||"")};
      }).filter(function(a){ return a.text; });
      flow.anchors=(d && d.anchors || []).slice(0,4).map(String).filter(Boolean);
      renderFlow(flow.actions.length ? "action" : "anchor");
    }).catch(function(){ renderFlow("anchor"); });
  }else{
    renderFlow("anchor");
  }
}

/* wait → action（1分に割った案）→ anchor（くっつける相手）→ done */
function renderFlow(stage){
  if(!flow){ after.innerHTML=""; return; }
  var live=find(flow.id);
  if(!live){ after.innerHTML=""; flow=null; return; }
  var h='<div class="thrown">'+esc(live.action)+"</div>";
  if(stage==="wait"){
    h+='<div class="wait"><i></i><span class="en">making it smaller</span></div>';
  }else if(stage==="action"){
    h+='<div class="say en" style="margin-top:24px">one minute</div><div class="cands">';
    flow.actions.forEach(function(a,i){
      h+='<button class="cand" data-a="'+i+'">'+esc(a.text)+"</button>";
    });
    h+="</div>";
  }else if(stage==="anchor"){
    h+='<div class="say en" style="margin-top:20px">after what</div>'+fieldHtml();
  }else{
    h+='<div class="say en">kept</div>';
  }
  after.innerHTML=h;
  seed.style.display = (stage==="wait"||stage==="action"||stage==="anchor") ? "none" : "";
  document.getElementById("pane-new").classList.toggle("scrolly", stage==="anchor");
}

/* ── 瞬間の場 ─────────────────────────── */
/* 一度に見渡せることを最優先する。今の時刻に近い塊を先に、明るく置く。 */
function phaseNow(){
  var h=new Date().getHours();
  return h<11 ? "morning" : h<17 ? "midday" : h<21 ? "evening" : "night";
}

function fieldHtml(){
  var now=phaseNow(), start=0, i;
  for(i=0;i<CLUSTERS.length;i++){ if(CLUSTERS[i][1]===now){ start=i; break; } }
  var order=CLUSTERS.slice(start).concat(CLUSTERS.slice(0,start));

  flow.pool=[];
  var h='<div class="field">';

  /* 鍵があるときは、その習慣に寄せた候補を最初の塊に置く。 */
  if(flow.anchors && flow.anchors.length){
    h+=cluster("for this", flow.anchors, true);
  }
  order.forEach(function(c,k){
    h+=cluster(c[0], c[2], !flow.anchors.length && k===0);
  });
  h+='<button class="mchip own en" data-own>write your own</button></div>';
  return h;
}

function cluster(name, items, near){
  var h='<div class="cluster'+(near?" near":"")+'"><span class="cl-glow"></span>'+
        '<div class="cl-name en">'+esc(name)+'</div><div class="cl-items">';
  items.forEach(function(t){
    var i=flow.pool.length; flow.pool.push(t);
    h+='<button class="mchip" data-m="'+i+'">'+esc(t)+"</button>";
  });
  return h+"</div></div>";
}

/* 出てこなかったら、自分で書く。 */
function writeOwn(){
  var btn=document.querySelector("[data-own]");
  if(!btn) return;
  btn.outerHTML='<input type="text" id="ownIn" class="own" placeholder="—" autocomplete="off">';
  var el=document.getElementById("ownIn");
  el.focus();
  function done(){
    if(!document.getElementById("ownIn")) return;   /* もう確定済み */
    var v=el.value.trim();
    if(v) takeAnchor(v);
  }
  el.addEventListener("keydown",function(e){
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==="Enter"){ e.preventDefault(); done(); }
  });
  el.addEventListener("blur",done);
}

function takeAnchor(text){
  var q=find(flow && flow.id);
  if(q && text){ q.anchor=text; save(); renderLines(); }
  renderFlow("done");
  setTimeout(function(){
    go(1); flow=null; after.innerHTML=""; seed.style.display="";
    document.getElementById("pane-new").classList.remove("scrolly");
  }, 700);
}

after.addEventListener("click",function(e){
  if(!flow) return;
  var m=e.target.closest("[data-m]");
  if(m){ takeAnchor(flow.pool[+m.getAttribute("data-m")]); return; }
  if(e.target.closest("[data-own]")){ writeOwn(); return; }
  var a=e.target.closest("[data-a]");
  if(a){
    var q1=find(flow.id), act=flow.actions[+a.getAttribute("data-a")];
    if(q1 && act){ q1.action=act.text; q1.title=act.text; save(); renderLines(); }
    renderFlow("anchor");
    return;
  }
});

var PROMPT=
"あなたは習慣設計のコーチです。続かないのは意志ではなく設計の問題だと知っています。\n"+
"ユーザーが身につけたいことを、1分以内で必ず終わる最小行動に割ってください。\n"+
"準備・道具・場所の移動が要らないこと。「5分」「10回」など1分を超える提案は禁止。\n"+
"それぞれに、すでに毎日やっている行動への接続点（その直後に差し込める具体的な場面）を付けてください。\n"+
"誇張・励まし口調・絵文字は禁止。淡々と書くこと。\n\n";
function promptFor(t){
  return PROMPT+"ユーザーが身につけたいこと: 「"+t+"」\n\n"+
  "次の形のJSONだけを返してください（説明文は不要）:\n"+
  '{"actions":[{"text":"1分で終わる具体的な行動。18文字以内"}],"anchors":["すでに毎日やっている行動。12文字以内、「〜したら」「〜の前に」の形"]}\n'+
  "actionsは3つ、anchorsは4つ。すべて日本語。";
}

function callClaude(prompt){
  var k=apiKey();
  if(!k) return Promise.reject({code:"no_key"});
  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":k,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:"claude-opus-5",
      max_tokens:4000,
      output_config:{effort:"low"},
      messages:[{role:"user",content:prompt}]
    })
  }).then(function(r){
    if(!r.ok) return Promise.reject({code:r.status===401||r.status===403?"auth":"http"});
    return r.json();
  },function(){ return Promise.reject({code:"network"}); })
  .then(function(res){
    if(res && res.stop_reason==="refusal") return Promise.reject({code:"refusal"});
    var text=(res.content||[]).filter(function(b){ return b.type==="text"; })
      .map(function(b){ return b.text||""; }).join("");
    var m=text.match(/```(?:json)?\s*([\s\S]*?)```/), body=m?m[1]:text;
    var a=body.indexOf("{"), b=body.lastIndexOf("}");
    if(a<0||b<=a) throw {code:"invalid_json"};
    return JSON.parse(body.slice(a,b+1));
  });
}

/* ── 記録 ─────────────────────────────── */
function renderDash(){
  var d=new Date();
  document.getElementById("dToday").textContent=MON[d.getMonth()]+" "+d.getDate()+", "+WD[d.getDay()];
  document.getElementById("dSub").textContent=key(d);
  document.getElementById("nLit").textContent=state.lit;
  document.getElementById("nPure").textContent=state.archive.length;
  var run=0; state.quests.forEach(function(q){ if(q.streak>run) run=q.streak; });
  document.getElementById("nRun").textContent=run;

  /* 直近10週。今日が最下段に来るよう、週の終わりで切り上げる。 */
  var t=key(), today=toDate(t), h="", i;
  var end=new Date(today); end.setDate(end.getDate() + (6 - end.getDay()));
  var start=new Date(end); start.setDate(start.getDate() - 69);
  for(i=0;i<70;i++){
    var day=new Date(start); day.setDate(day.getDate()+i);
    var k=key(day), n=state.days[k]||0;
    var op=n?Math.min(1,0.46+n*0.27):0;
    h+='<div class="cell'+(k===t?" today":"")+'" title="'+k+'">'+
       (n?'<span class="f" style="opacity:'+op.toFixed(2)+'"></span>':"")+"</div>";
  }
  document.getElementById("grid").innerHTML=h;

  var box=document.getElementById("relics");
  if(!state.archive.length){
    box.innerHTML='<p class="none en">nothing yet.</p>';
  }else{
    var r="";
    state.archive.slice().reverse().forEach(function(a){
      r+='<div class="relic"><span class="d"></span><p>'+esc(a.action)+
         "</p><time>"+esc(a.done)+"</time></div>";
    });
    box.innerHTML=r;
  }
}

/* ── 三面の行き来 ─────────────────────── */
var pager=document.getElementById("pager");
var dotBtns=document.getElementById("dots").children;
var touched=false;
/* scrollTo({behavior:"smooth"}) は scroll-snap-stop:always に打ち消されて動かない。
   トゥイーンの間だけスナップを外し、自分で滑らせる。 */
var tween=null, guard=null, dur=300;
function land(to){
  if(tween){ cancelAnimationFrame(tween); tween=null; }
  pager.scrollLeft=to;
  pager.style.scrollSnapType="";
}
function go(i){
  touched=true;
  var from=pager.scrollLeft, to=i*pager.clientWidth;
  setDots(i);
  if(Math.abs(to-from)<1) return;
  if(tween) cancelAnimationFrame(tween);
  clearTimeout(guard);
  pager.style.scrollSnapType="none";
  var t0=null;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var e=k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    pager.scrollLeft=from+(to-from)*e;
    if(k<1) tween=requestAnimationFrame(step);
    else land(to);
  }
  tween=requestAnimationFrame(step);
  /* 画面が隠れていると rAF は止まる。滑らせられなくても必ず着地させる。 */
  guard=setTimeout(function(){ land(to); }, dur+220);
}
function setDots(i){ for(var n=0;n<3;n++) dotBtns[n].classList.toggle("on", n===i); }
for(var di=0; di<dotBtns.length; di++){
  dotBtns[di].addEventListener("click",function(e){
    go(+e.currentTarget.getAttribute("data-go"));
  });
}
document.addEventListener("keydown",function(e){
  if(sheet.classList.contains("on")) return;
  if(document.activeElement===seed) return;
  var i=Math.round(pager.scrollLeft/pager.clientWidth);
  if(e.key==="ArrowLeft" && i>0) go(i-1);
  if(e.key==="ArrowRight" && i<2) go(i+1);
});
var st=null;
pager.addEventListener("scroll",function(){
  clearTimeout(st);
  st=setTimeout(function(){ setDots(Math.round(pager.scrollLeft/pager.clientWidth)); },70);
});
window.addEventListener("resize",function(){
  var i=Math.round(pager.scrollLeft/pager.clientWidth);
  pager.scrollLeft=i*pager.clientWidth;
});

/* ── 和紙の繊維 ───────────────────────── */
function washi(){
  try{
    var c=document.createElement("canvas"), S=512;
    c.width=c.height=S;
    var g=c.getContext("2d"); if(!g) return;
    var col=getComputedStyle(document.documentElement).getPropertyValue("--fiber").trim();
    g.strokeStyle=col||"rgba(120,108,84,.055)"; g.lineCap="round";
    for(var i=0;i<230;i++){
      var x=Math.random()*S, y=Math.random()*S,
          a=Math.random()*Math.PI*2, len=4+Math.random()*34;
      g.lineWidth=0.3+Math.random()*0.5;
      g.beginPath(); g.moveTo(x,y);
      g.quadraticCurveTo(x+Math.cos(a)*len*0.5+(Math.random()-0.5)*5,
                         y+Math.sin(a)*len*0.5+(Math.random()-0.5)*5,
                         x+Math.cos(a)*len, y+Math.sin(a)*len);
      g.stroke();
    }
    document.body.style.backgroundImage="url("+c.toDataURL("image/png")+")";
    document.body.style.backgroundRepeat="repeat";
  }catch(e){}
}

/* ── 設定 ─────────────────────────────── */
function reflectKey(){
  var has=!!apiKey();
  document.getElementById("keyIn").placeholder = has ? "saved" : "sk-ant-…";
  document.getElementById("keyNote").textContent = has
    ? "it stays on this phone. nothing but anthropic sees it. save it empty to forget it."
    : "optional. with it, what you throw in comes back smaller.";
}
document.getElementById("keySave").addEventListener("click",function(){
  var el=document.getElementById("keyIn"), v=el.value.trim();
  try{ if(v) localStorage.setItem(KEYK,v); else localStorage.removeItem(KEYK); }catch(e){}
  el.value=""; el.blur(); reflectKey();
});
document.getElementById("ioOut").addEventListener("click",function(){
  var b=document.getElementById("ioBox");
  b.value=JSON.stringify(state); b.focus(); b.select();
  document.getElementById("ioNote").textContent="hold it somewhere, paste it there.";
});
document.getElementById("ioIn").addEventListener("click",function(){
  var b=document.getElementById("ioBox"), t=b.value.trim();
  if(!t) return;
  try{
    var o=JSON.parse(t);
    if(!o || !Array.isArray(o.quests)) throw 0;
    o.archive=o.archive||[]; o.lit=o.lit||0; o.days=o.days||{};
    state=o; save(); renderLines(); renderDash(); renderNew();
    b.value=""; document.getElementById("ioNote").textContent="here they are.";
  }catch(e){
    document.getElementById("ioNote").textContent="that did not read. check it.";
  }
});

/* ── 起動 ─────────────────────────────── */
renderLines(); renderDash(); renderNew(); reflectKey(); washi();
/* 中央（今日）から始める。フォントの読み込みで再レイアウトが入ると
   scroll-snap が先頭（登録）へ戻してしまうので、指が触れるまで何度か置き直す。 */
function center(){
  if(touched || !pager.clientWidth) return;
  pager.scrollLeft=pager.clientWidth;
  setDots(1);
}
["pointerdown","touchstart","wheel","keydown"].forEach(function(ev){
  window.addEventListener(ev,function(){ touched=true; },{passive:true});
});
center();
requestAnimationFrame(center);
window.addEventListener("load",center);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(center).catch(function(){});
[60,200,500,900].forEach(function(ms){ setTimeout(center, ms); });

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
